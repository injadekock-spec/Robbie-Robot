/* ================= Leerkracht ================= */
function toonJuf(melding = '') {
  const tok = (() => { try { return sessionStorage.getItem('rs-tok'); } catch (e) { return null; } })();
  const terugStart = () => (profiel ? ga(toonKaart) : ga(toonStart));
  if (!tok) {
    app.innerHTML = `<div class="start"><div class="startkaart"><h1>Voor de juf of meester</h1>
      <p class="sub">Meld je aan met het leerkrachtaccount van de Robbie-apps.</p>
      ${melding ? `<p class="melding fout">${esc(melding)}</p>` : ''}
      <form id="f" class="kol"><input id="em" type="email" placeholder="E-mailadres" autocomplete="username" aria-label="E-mailadres"><input id="pw" type="password" placeholder="Wachtwoord" autocomplete="current-password" aria-label="Wachtwoord">
      <div class="rij"><button type="button" id="terug">Terug</button><button class="knop-hoofd">Aanmelden</button></div></form></div></div>`;
    app.querySelector('#terug').onclick = terugStart;
    app.querySelector('#f').onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: app.querySelector('#em').value.trim(), password: app.querySelector('#pw').value }) });
        const j = await r.json();
        if (!r.ok || !j.access_token) return toonJuf('Aanmelden lukte niet. Kijk je e-mailadres en wachtwoord na.');
        try { sessionStorage.setItem('rs-tok', j.access_token); } catch (err) {}
        toonJuf();
      } catch (err) { toonJuf('Ik kan de server niet bereiken. Het leerkrachtpaneel werkt alleen in de online versie van de app.'); }
    };
    return;
  }
  const code = (() => { try { return sessionStorage.getItem('rs-kc') || ''; } catch (e) { return ''; } })();
  app.innerHTML = kopJuf() + `<main><h1>Leerkrachtpaneel</h1>
    <h2 style="margin-top:14px">Kies een klas</h2>
    <div class="knoppen" id="klassen"><p>Klassen laden...</p></div>
    <details style="margin:12px 0"><summary>Klascode zelf intikken</summary>
    <form id="kf" class="rij" style="margin:10px 0;max-width:520px"><input id="kc" maxlength="6" placeholder="Klascode" value="${esc(code)}" aria-label="Klascode"><button class="knop-hoofd" style="flex:0 0 auto">Toon klas</button></form></details>
    ${melding ? `<p class="melding fout">${esc(melding)}</p>` : ''}
    <div id="ov"></div></main>`;
  bindJuf(terugStart);
  const kies = c => { try { sessionStorage.setItem('rs-kc', c); } catch (err) {} app.querySelectorAll('[data-kc]').forEach(b => b.classList.toggle('knop-hoofd', b.dataset.kc === c)); laadKlas(c, tok); };
  app.querySelector('#kf').onsubmit = e => { e.preventDefault(); kies(app.querySelector('#kc').value.trim().toUpperCase()); };
  (async () => {
    const el = app.querySelector('#klassen');
    try {
      const r = await fetch(`${CFG.url}/rest/v1/klassen?select=naam,code&order=naam`, { headers: { apikey: CFG.key, Authorization: 'Bearer ' + tok } });
      if (r.status === 401) { try { sessionStorage.removeItem('rs-tok'); } catch (x) {} return toonJuf('Je sessie is verlopen. Meld je opnieuw aan.'); }
      const lijst = r.ok ? await r.json() : [];
      el.innerHTML = lijst.length ? lijst.map(k => `<button data-kc="${esc(k.code)}" class="${k.code === code ? 'knop-hoofd' : ''}">${esc(k.naam)} <small style="opacity:.75">(${esc(k.code)})</small></button>`).join('') : '<p>Nog geen klassen. Maak er een aan in Robotland (slotje, Klassen).</p>';
      el.querySelectorAll('[data-kc]').forEach(b => b.onclick = () => kies(b.dataset.kc));
      if (!code && lijst.length === 1) kies(lijst[0].code);
    } catch (e) { el.innerHTML = '<p>De klassen konden niet geladen worden. Tik de klascode zelf in.</p>'; }
  })();
  if (code) laadKlas(code, tok);
}
function kopJuf() {
  return `<header class="kop"><button id="terugknop" class="terug">${ico('iTerug')} Terug</button><div class="naam"><svg class="logo" viewBox="0 0 80 80"><use href="#aRobbie"/></svg><span>Leerkrachtpaneel</span></div><button id="uitjuf">Afmelden</button></header>`;
}
function bindJuf(terug) {
  app.querySelector('#terugknop').onclick = terug;
  app.querySelector('#uitjuf').onclick = () => { try { sessionStorage.removeItem('rs-tok'); } catch (e) {} toonJuf(); };
}
async function laadKlas(code, tok) {
  const ov = app.querySelector('#ov');
  ov.innerHTML = '<p>Even laden...</p>';
  let lijst;
  try { lijst = await rpc('sk_overzicht', { p_code: code }, tok); }
  catch (e) {
    if (e.status === 401 || /JWT/i.test(e.message)) { try { sessionStorage.removeItem('rs-tok'); } catch (x) {} return toonJuf('Je sessie is verlopen. Meld je opnieuw aan.'); }
    ov.innerHTML = `<p class="melding fout">Laden lukte niet: ${esc(e.message).slice(0, 200)}</p>`; return;
  }
  if (!lijst.length) { ov.innerHTML = '<p class="melding">Geen leerlingen gevonden voor deze klascode.</p>'; return; }
  const rij = l => {
    const g = l.gegevens || {}, act = g.act || {};
    const werelden = I.werelden.filter(w => act[key(w, baasVan(w))]).length;
    const sterren = Object.values(act).reduce((t, x) => t + (x.s || 0), 0);
    const goud = Object.values(act).filter(x => x.s >= 2).length;
    const sp = g.spel || {};
    return `<tr><td>${esc(l.symbool)} ${esc(l.naam)}</td><td class="num">${werelden}/10</td><td class="num">${sterren} (${goud} goud)</td><td class="num">${Object.keys(g.puzzels || {}).length}</td><td class="num">${sp.gespeeld || 0} (${sp.gewonnen || 0} gew.)</td><td>${l.bijgewerkt && l.heeft_code ? new Date(l.bijgewerkt).toLocaleDateString('nl-BE') : l.heeft_code ? '' : 'nog niet gestart'}</td><td><button class="knop-klein" data-id="${l.id}">Details</button></td></tr>`;
  };
  ov.innerHTML = `<div class="scroll"><table><thead><tr><th>Leerling</th><th>Werelden</th><th>Sterren</th><th>Puzzels</th><th>Partijen</th><th>Laatst actief</th><th></th></tr></thead><tbody>${lijst.map(rij).join('')}</tbody></table></div><div id="det" style="margin-top:18px"></div>`;
  ov.querySelectorAll('[data-id]').forEach(b => b.onclick = () => detail(lijst.find(l => l.id === b.dataset.id), code, tok));
}
function detail(l, code, tok) {
  const det = app.querySelector('#det');
  const g = l.gegevens || {}, act = g.act || {}, is = l.instellingen || {};
  const refl = g.refl || {};
  det.innerHTML = `<div class="paneel"><h2>${esc(l.symbool)} ${esc(l.naam)}</h2>
    <div class="scroll"><table><thead><tr><th>Wereld</th><th>Opdrachten</th><th>Sterren</th><th>Reflectie</th></tr></thead><tbody>
    ${I.werelden.map(w => {
      const gd = w.act.filter(a => act[key(w, a)]), st = w.act.reduce((t, a) => t + ((act[key(w, a)] || {}).s || 0), 0);
      const r = refl[w.id];
      return `<tr><td>${esc(w.naam)}</td><td class="num">${gd.length}/${w.act.length}</td><td class="num">${st}/${w.act.length * 2}</td><td>${r ? `${['Makkelijk', 'Goed te doen', 'Moeilijk'][r.gevoel] || ''}${r.strategie && r.strategie.length ? ' · ' + r.strategie.map(esc).join('; ') : ''}` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>
    <p>Eigen puzzels gemaakt: <b>${(g.mijn || []).length}</b>.</p>
    <h3>Instellingen voor deze leerling</h3>
    <label class="schakel"><input type="checkbox" id="sv" ${is.voorlezen !== false ? 'checked' : ''}> Voorlezen staat standaard aan</label>
    <label class="schakel">Maximum partijen per dag in de speelzaal <select id="sm">${[0, 1, 2, 3, 4, 5].map(n => `<option ${(Number.isFinite(+is.maxPartijen) ? +is.maxPartijen : 2) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label class="schakel">Eén partij per <select id="sp">${[2, 3, 4, 5].map(n => `<option ${(+is.muntPer || 3) === n ? 'selected' : ''}>${n}</option>`).join('')}</select> opdrachten of puzzels die dag</label>
    <label class="schakel"><input type="checkbox" id="sa" ${is.alles ? 'checked' : ''}> Alle werelden ontgrendelen</label>
    <div class="knoppen"><button id="bew" class="knop-hoofd">Instellingen bewaren</button><button id="wiscode">Prentjescode wissen</button><button id="wisvg">Voortgang wissen</button></div>
    <p id="dm" class="teller"></p></div>`;
  const dm = det.querySelector('#dm');
  det.querySelector('#bew').onclick = async () => {
    const nieuw = { voorlezen: det.querySelector('#sv').checked, maxPartijen: +det.querySelector('#sm').value, muntPer: +det.querySelector('#sp').value, alles: det.querySelector('#sa').checked, t: Date.now() };
    try { await rpc('sk_instellingen', { p_leerling: l.id, p_instellingen: nieuw }, tok); l.instellingen = nieuw; dm.textContent = 'Bewaard. De leerling krijgt de nieuwe instellingen bij de volgende keer bewaren of aanmelden.'; }
    catch (e) { dm.textContent = 'Bewaren lukte niet.'; }
  };
  const bevestig = (vraag, fn) => venster(`<h2>Zeker?</h2><p>${vraag}</p><div class="knoppen" style="justify-content:center"><button id="nee" class="knop-hoofd">Annuleren</button><button id="ja">Ja</button></div>`, v => {
    v.querySelector('#nee').onclick = sluit;
    v.querySelector('#ja').onclick = async () => { sluit(); await fn(); };
  });
  det.querySelector('#wiscode').onclick = () => bevestig(`De prentjescode van ${esc(l.naam)} wordt gewist. De leerling kiest daarna een nieuwe code. De voortgang blijft bewaard.`, async () => {
    try { await rpc('sk_code_wissen', { p_leerling: l.id }, tok); dm.textContent = 'Prentjescode gewist.'; } catch (e) { dm.textContent = 'Wissen lukte niet.'; }
  });
  det.querySelector('#wisvg').onclick = () => bevestig(`Alle schaakvoortgang van ${esc(l.naam)} wordt gewist. Dit kan je niet ongedaan maken.`, async () => {
    try { await rpc('sk_voortgang_wissen', { p_leerling: l.id }, tok); dm.textContent = 'Voortgang gewist.'; laadKlas(code, tok); } catch (e) { dm.textContent = 'Wissen lukte niet.'; }
  });
  det.scrollIntoView({ behavior: 'smooth' });
}

/* ================= Opstarten ================= */
async function init() {
  if (!profiel && URLKLAS.length === 6) {
    try { const r = await rpc('sk_klas', { p_code: URLKLAS }); if (r) { LS.set('rs-laatste-code', URLKLAS); return toonLeerlingen(URLKLAS, r); } } catch (e) {}
  }
  if (!profiel) return ga(toonStart);
  data = samen(LS.get(dataSleutel(), null), null);
  inst = LS.get(instSleutel(), {});
  ga(toonKaart);
  if (profiel.modus !== 'klas') return;
  try {
    const r = await rpc('sk_laden', { p_code: profiel.code, p_leerling: profiel.leerling.id, p_pin: profiel.pin });
    if (r && r.ok) {
      const voor = JSON.stringify(r.gegevens || {});
      data = samen(data, r.gegevens);
      inst = r.instellingen || {}; LS.set(instSleutel(), inst); LS.set(dataSleutel(), data);
      zetSync('ok');
      if (JSON.stringify(data) !== voor) naarServer();
      if (huidig && (huidig.fn === toonKaart || huidig.fn === toonWereld)) ga(huidig.fn, ...huidig.args);
    } else if (r && ['foute_code', 'geen_code', 'onbekend'].includes(r.fout)) {
      profiel = null; LS.del('rs-profiel');
      ga(toonStart, 'Meld je opnieuw aan met je klascode en prentjescode.');
    } else zetSync('offline');
  } catch (e) { zetSync('offline'); }
}
window.addEventListener('beforeunload', () => { if (bewaarTimer && profiel && profiel.modus === 'klas') { clearTimeout(bewaarTimer); naarServer(); } });
init();
}
