<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --U:#3b82f6; --R:#22c55e; --D:#f59e0b; --L:#a855f7;
  --ab:clamp(54px, 10vmin, 92px);
  --bs:clamp(36px, 5.4vmin, 56px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:#fff;background:#1b1446;touch-action:manipulation}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
input,select,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
svg{display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:filter .6s}
body.n2 #bg{filter:hue-rotate(-45deg) saturate(1.1)}
body.n3 #bg{filter:hue-rotate(-95deg) saturate(1.15) brightness(.92)}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:bl 2.4s steps(1) infinite}
@keyframes bl{0%{opacity:1}50%{opacity:.15}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:18s}
@keyframes spin{to{transform:rotate(360deg)}}
.hover{animation:hov 4s ease-in-out infinite}
@keyframes hov{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.screen{position:fixed;inset:0;z-index:1;display:none}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;position:relative;z-index:3}
.ibtn{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.ibtn svg{width:58%;height:58%}
.ibtn:active{transform:scale(.94)}
.ibtn.off{opacity:.45}
.spacer{flex:1}
.robbie-big{height:clamp(80px,15vmin,140px);animation:wave 2.2s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
@keyframes wave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.title{font-size:clamp(26px,5.2vmin,54px);font-weight:700;line-height:1;text-shadow:0 4px 0 #4338ca,0 8px 18px rgba(0,0,0,.5)}
.title small{display:block;font-size:.4em;font-weight:500;color:#c7d2fe;text-shadow:none;margin-top:8px}
.scroll{flex:1;overflow:auto;width:100%;display:flex;flex-direction:column;align-items:center;padding:0 16px 30px;position:relative;z-index:2}

/* HOME */
#home{flex-direction:column}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px;width:100%;max-width:1040px;margin-top:8px}
.kid{background:rgba(20,14,60,.8);border:3px solid rgba(255,255,255,.18);border-radius:22px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.kid .sym{font-size:48px;line-height:1.1;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center}
.kid .sym img{height:62px}
.kid .nm{font-size:17px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.kid:active{transform:scale(.96)}
.kid.guest{border-style:dashed}
.bigplay{margin-top:30px;width:150px;height:150px;border-radius:50%;background:#16a34a;display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 0 10px rgba(34,197,94,.25);animation:pulse2 1.6s ease-in-out infinite}
.bigplay svg{width:52%;height:52%}
@keyframes pulse2{50%{box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 0 22px rgba(34,197,94,0)}}
.hint{color:#c7d2fe;font-size:15px;margin-top:14px;text-align:center;max-width:520px;font-family:system-ui,sans-serif}

/* NIVEAUS */
#nivs{flex-direction:column}
.player{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);border-radius:30px;padding:4px 16px 4px 4px;height:54px}
.player .sym{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px}
.player .sym img{height:36px}
.player span{font-weight:600;font-size:18px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nivcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:100%;max-width:1080px;margin-top:10px}
@media (max-width:820px){.nivcards{grid-template-columns:1fr}}
.nivcard{position:relative;background:rgba(20,14,60,.82);border:4px solid var(--nc);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.nivcard:active{transform:scale(.98)}
.nivcard .dots{display:flex;gap:8px}
.nivcard .dots i{width:20px;height:20px;border-radius:50%;background:var(--nc);display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.nivcard .art{width:120px;height:120px;border-radius:30px;background:var(--nc);display:grid;place-items:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.nivcard .art svg{width:72%;height:72%}
.nivcard h2{margin:0;font-size:28px}
.nivcard h3{margin:0;font-size:17px;font-weight:500;color:#e0e7ff}
.nivcard .age{font-size:13px;color:#a5b4fc;font-family:system-ui,sans-serif}
.pbar{width:100%;height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--nc);border-radius:8px}
.nivcard .dip{position:absolute;top:-14px;right:-10px;width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.nivcard.locked{opacity:.35;pointer-events:none}

/* LEVEL MAP */
#nivmap{flex-direction:column}
.storybox{width:100%;max-width:1080px;background:rgba(20,14,60,.78);border:3px solid var(--nc);border-radius:26px;padding:14px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.storybox .vis{flex:none;width:clamp(150px,26vw,280px)}
.storybox .vis svg{width:100%;height:auto}
.storybox p{margin:0;font-size:clamp(15px,2.2vmin,19px);line-height:1.4;color:#e0e7ff}
.storybox .stxt{flex:1;display:flex;flex-direction:column;gap:10px}
.storybox.beg{justify-content:center;width:auto}
.storybox.beg .vis{width:min(560px,86vw)}
.lvgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;width:100%;max-width:1080px;margin-top:18px}
@media (max-width:700px){.lvgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.lv .num{width:clamp(58px,9vmin,80px);height:clamp(58px,9vmin,80px);border-radius:50%;background:linear-gradient(#fff,#cbd5e1);color:#1e1b4b;font-size:clamp(26px,4.4vmin,36px);font-weight:700;display:grid;place-items:center;box-shadow:0 5px 0 var(--nc),0 8px 14px rgba(0,0,0,.35)}
.lv.house .num{border-radius:10px;background:none;box-shadow:none;width:clamp(70px,11vmin,100px);height:clamp(70px,11vmin,100px)}
.lv.house .num svg{width:100%;height:100%}
.lv:active .num{transform:translateY(3px)}
.lv .stars{display:flex;gap:1px}
.lv .stars svg{width:18px;height:18px}
.lv .bug{position:absolute;top:-6px;right:4px;width:30px;height:30px}
.lv .nw{position:absolute;top:-8px;left:0;background:#ec4899;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:700}
.lv.nextup .num{animation:pulse 1.4s ease-in-out infinite}
.mapdip{display:none;gap:12px;align-items:center;justify-content:center;margin-top:18px}
.mapdip.on{display:flex}
.btn{display:inline-flex;align-items:center;gap:10px;background:#16a34a;border-radius:18px;padding:12px 22px;font-size:20px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn svg{width:30px;height:30px}
.btn.gold{background:#ca8a04}
.btn.blue{background:#4f46e5}
.btn.gray{background:#475569}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}

/* GAME */
#game{flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;position:relative;z-index:3}
.lvlbadge{min-width:54px;height:54px;border-radius:50%;background:var(--nc,#22c55e);display:grid;place-items:center;font-size:28px;font-weight:700;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);padding:0 10px}
.goalstrip{display:flex;align-items:center;gap:6px;background:rgba(15,10,45,.7);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:5px 12px;height:54px}
.goalstrip svg{width:36px;height:36px}
.goalstrip .gb.miss{filter:grayscale(1);opacity:.35}
.goalstrip .then{width:22px;height:22px;opacity:.7}
.blkcount{display:none;align-items:center;gap:6px;background:rgba(15,10,45,.7);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:5px 14px;height:54px;font-size:20px;font-weight:600}
.blkcount.on{display:flex}
.blkcount.over{border-color:#ef4444;color:#fecaca}
.blkcount svg{width:28px;height:28px}
.bugtag{width:46px;height:46px;display:none}
.bugtag.on{display:block;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}

.gmain{flex:1;display:flex;gap:14px;padding:0 14px 14px;min-height:0;position:relative;z-index:2}
#boardWrap{flex:1.25;display:grid;place-items:center;min-width:0;min-height:0}
#ctrl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vmin,18px);min-width:0;min-height:0}
#game.tree #ctrl{justify-content:flex-start;align-items:stretch}
@media (orientation:portrait){
  .gmain{flex-direction:column}
  #boardWrap{flex:1}
  #ctrl{flex:none}
  #game.tree #boardWrap{flex:none;height:40vh}
  #game.tree #ctrl{flex:1}
}
.frame{padding:10px;border-radius:22px;background:repeating-linear-gradient(45deg,#facc15 0 14px,#1f2937 14px 28px);box-shadow:0 14px 40px rgba(0,0,0,.55)}
.frame-in{background:#334155;border-radius:12px;padding:4px}
#board{position:relative;display:grid;grid-template-columns:repeat(var(--c),var(--cs));grid-auto-rows:var(--cs);border-radius:10px}
.tile{border:1px solid #7c8ba1;background:
   radial-gradient(circle at 13% 13%,#64748b 0 2.5px,transparent 3.5px),radial-gradient(circle at 87% 13%,#64748b 0 2.5px,transparent 3.5px),
   radial-gradient(circle at 13% 87%,#64748b 0 2.5px,transparent 3.5px),radial-gradient(circle at 87% 87%,#64748b 0 2.5px,transparent 3.5px),
   linear-gradient(135deg,#e8edf3,#aebccd);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.tile.b{background:
   radial-gradient(circle at 13% 13%,#64748b 0 2.5px,transparent 3.5px),radial-gradient(circle at 87% 13%,#64748b 0 2.5px,transparent 3.5px),
   radial-gradient(circle at 13% 87%,#64748b 0 2.5px,transparent 3.5px),radial-gradient(circle at 87% 87%,#64748b 0 2.5px,transparent 3.5px),
   linear-gradient(135deg,#d6dee8,#9dadc1)}
.pc{position:absolute;left:calc(var(--x)*var(--cs));top:calc(var(--y)*var(--cs));width:var(--cs);height:var(--cs);display:grid;place-items:center;pointer-events:none}
.pc>svg{width:82%;height:82%}
.pc.obs.s>svg,.pc.obs.h>svg{width:100%;height:100%}
.startpad>svg{width:86%;height:86%}
.dot>i{width:22%;height:22%;border-radius:50%;background:var(--col);box-shadow:0 0 0 3px rgba(255,255,255,.7);display:block;animation:dotin .3s ease-out}
@keyframes dotin{from{transform:scale(0)}}
.scan{background:rgba(34,211,238,.35);box-shadow:inset 0 0 0 4px #22d3ee;border-radius:8px;animation:scan .45s ease-out forwards;z-index:4}
.scan.no{background:rgba(244,63,94,.25);box-shadow:inset 0 0 0 4px #f43f5e}
@keyframes scan{from{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1)}to{opacity:.9}}
.goal.locked>svg{filter:grayscale(.85) brightness(.85);opacity:.6}
.goal.unlock>svg{animation:unl .9s ease-out}
@keyframes unl{40%{transform:scale(1.35);filter:drop-shadow(0 0 16px #4ade80)}}
.goal.charged>svg{animation:chg .45s ease-in-out 4;filter:drop-shadow(0 0 16px #4ade80)}
@keyframes chg{50%{transform:scale(1.18)}}
.bolt>svg{animation:shine 2.2s ease-in-out infinite}
@keyframes shine{50%{transform:rotate(20deg) scale(1.08)}}
.bolt.got>svg{animation:pop .55s ease-in forwards}
@keyframes pop{40%{transform:scale(1.6)}100%{transform:scale(0) rotate(200deg);opacity:0}}
.bolt.flash>svg{animation:flash .35s ease-in-out 5}
@keyframes flash{50%{transform:scale(1.4);filter:drop-shadow(0 0 12px #fde047)}}
.robot{z-index:5;transition:left var(--mv,.38s) ease-in-out,top var(--mv,.38s) ease-in-out}
.robot .rb{position:absolute;inset:0;display:grid;place-items:center}
.robot img{height:calc(var(--cs)*.96);width:auto;max-width:none;filter:drop-shadow(0 5px 3px rgba(0,0,0,.35));transition:transform .2s}
#game.tree .robot img{height:calc(var(--cs)*.86)}
.robot .face{position:absolute;inset:0;transition:transform var(--tv,.3s) ease-in-out;display:none}
#game.tree .robot .face{display:block}
.robot .face::before{content:'';position:absolute;left:50%;top:calc(var(--cs)*-.1);transform:translateX(-50%);border-left:calc(var(--cs)*.15) solid transparent;border-right:calc(var(--cs)*.15) solid transparent;border-bottom:calc(var(--cs)*.2) solid #fde047;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.robot.dance .rb{animation:dance .5s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18%) rotate(-10deg)}75%{transform:translateY(-18%) rotate(10deg)}}
.bubble{position:absolute;left:62%;top:-38%;width:58%;height:58%;border-radius:50%;background:#fff;color:#1e1b4b;display:grid;place-items:center;font-weight:700;font-size:calc(var(--cs)*.38);box-shadow:0 4px 10px rgba(0,0,0,.35);animation:bub 2.4s ease-out forwards;z-index:6}
.bubble.bad{background:#fecaca;color:#b91c1c}
@keyframes bub{0%{transform:scale(0)}12%{transform:scale(1.15)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* beginner strip */
.progbox{width:100%;max-width:min(560px,100%);background:rgba(15,10,45,.8);border:3px solid #818cf8;border-radius:22px;padding:10px 12px;box-shadow:0 0 24px rgba(129,140,248,.35);display:flex;gap:10px;align-items:flex-start}
.progbox .head{width:var(--bs);height:var(--bs);flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.1)}
.progbox .head img{height:88%;max-width:100%;object-fit:contain}
#strip{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.blk,.eslot{width:var(--bs);height:var(--bs);border-radius:12px;flex:none}
.eslot{border:3px dashed rgba(255,255,255,.22)}
.blk{background:var(--col);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.blk svg{width:72%;height:72%}
.blk.active{outline:4px solid #fde047;outline-offset:2px;transform:translateY(-4px) scale(1.08)}
.blk.next{outline:4px dashed #fde047;outline-offset:2px}
.blk.err{outline:5px solid #ef4444;outline-offset:2px;animation:shake .45s}
.blk.added{animation:addin .25s ease-out}
@keyframes addin{from{transform:scale(.3)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shakeit{animation:shake .4s}
.U{--col:var(--U)}.R{--col:var(--R)}.D{--col:var(--D)}.L{--col:var(--L)}
.pad{display:grid;grid-template-columns:repeat(3,var(--ab));grid-template-rows:repeat(3,var(--ab));gap:8px}
.arw{width:var(--ab);height:var(--ab);border-radius:22px;background:var(--col);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.35)}
.arw svg{width:66%;height:66%}
.arw:active,.act:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.arw.U{grid-area:1/2}.arw.L{grid-area:2/1}.arw.R{grid-area:2/3}.arw.D{grid-area:3/2}
.padcenter{grid-area:2/2;display:grid;place-items:center;opacity:.9;pointer-events:none;min-width:0;min-height:0;overflow:hidden}
.padcenter img{height:80%;max-width:100%;object-fit:contain}

/* tree editor */
.taskbox{display:none;gap:10px;align-items:flex-start;background:rgba(15,10,45,.82);border:2px solid rgba(255,255,255,.2);border-radius:18px;padding:8px 12px}
#game.tree .taskbox{display:flex}
.taskbox p{margin:0;font-size:clamp(14px,1.9vmin,17px);line-height:1.35;color:#e0e7ff;flex:1;max-height:5.6em;overflow:auto}
.taskbox .ibtn{width:40px;height:40px;border-radius:12px}
.palette{display:none;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:7px}
#game.tree .palette{display:grid}
#game.tree .pad,#game.tree .progbox{display:none}
.pb{position:relative;display:flex;align-items:center;gap:6px;background:var(--bc);border-radius:12px;padding:6px 8px;font-weight:600;font-size:clamp(13px,1.8vmin,16px);box-shadow:0 4px 0 rgba(0,0,0,.3);text-align:left;line-height:1.1}
.pb .ic{width:28px;height:28px;flex:none}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pb .new{position:absolute;top:-9px;right:-6px;background:#ec4899;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pb.isnew{box-shadow:0 0 0 3px #fde047,0 4px 0 rgba(0,0,0,.3)}
.codewrap{display:none;flex:1;min-height:120px;overflow:auto;background:rgba(15,10,45,.82);border:3px solid #818cf8;border-radius:18px;padding:6px 8px 12px}
#game.tree .codewrap{display:block}
.codehead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#c7d2fe;padding:4px 4px 2px;text-transform:uppercase;letter-spacing:.5px}
.codehead img{height:24px}
.code{display:flex;flex-direction:column;gap:5px;padding:4px 2px 4px 4px;align-items:flex-start}
.nd{position:relative;border-radius:12px;--bc:#475569}
.prim{display:flex;align-items:center;gap:8px;background:var(--bc);padding:4px 14px 4px 4px;font-weight:600;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.3);min-width:150px;cursor:pointer}
.prim .ic,.cont .hd .ic{width:30px;height:30px;flex:none;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.prim .ic svg,.cont .hd .ic svg{width:80%;height:80%}
.cont{background:var(--bc);padding:3px;box-shadow:0 3px 0 rgba(0,0,0,.3);min-width:190px}
.cont>.hd,.cont>.mid{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 2px;font-weight:600;font-size:16px;cursor:pointer;flex-wrap:wrap}
.cont>.mid{padding-left:12px;font-size:14px;opacity:.95}
.cont>.bd{margin-left:16px;background:rgba(15,10,45,.6);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:160px}
.chip{background:#fff;color:#1e1b4b;border-radius:999px;padding:3px 11px;font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.chip:active{transform:scale(.95)}
.itb{font-size:13px;background:rgba(0,0,0,.3);border-radius:8px;padding:1px 7px;display:none}
.itb.on{display:inline-block}
.res{font-size:13px;border-radius:8px;padding:1px 8px;display:none;font-weight:700}
.res.on{display:inline-block}
.res.y{background:#16a34a}.res.n{background:#be123c}

const DV=[[0,-1],[1,0],[0,1],[-1,0]];
const ABS={U:0,R:1,D:2,L:3};
const HIGH=new Set(['k','c','s']);
const LIMIT=600;

function parseLevel(L,niv){
  L.niv=niv.n; L.mode=niv.mode; L.r=L.m.length; L.c=L.m[0].length;
  L.obsMap=new Map(); L.bolts=[]; L.obs=[];
  L.m.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if(ch==='@'){L.s=[x,y,1];}
    else if('NESW'.includes(ch)){L.s=[x,y,'NESW'.indexOf(ch)];}
    else if(ch==='G'){L.g=[x,y];}
    else if(ch==='b'){L.bolts.push([x,y]);}
    else if('kcosh'.includes(ch)){L.obsMap.set(x+','+y,ch);L.obs.push([x,y,ch]);}
  }));
  L.full=(1<<L.bolts.length)-1;
  if(L.mode==='abs'){ L.opt=bfs(L); L.slots=Math.min(16,Math.max(6,L.opt+4,(L.pre||'').length+3)); }
  else { L.best=L.best||99; L.max=L.max||24; L.blocks=L.blocks||ALLMOVE; L.conds=L.conds||['vrij']; }
}
function bfs(L){
  const q=[[L.s[0],L.s[1],0,0]],seen=new Set([L.s[0]+','+L.s[1]+',0']);
  while(q.length){const [x,y,m,d]=q.shift();
    for(let dir=0;dir<4;dir++){const nx=x+DV[dir][0],ny=y+DV[dir][1];
      if(nx<0||ny<0||nx>=L.c||ny>=L.r||L.obsMap.has(nx+','+ny))continue;
      let nm=m;const bi=L.bolts.findIndex(b=>b[0]===nx&&b[1]===ny);if(bi>=0)nm|=1<<bi;
      if(nx===L.g[0]&&ny===L.g[1]&&nm===L.full)return d+1;
      const k=nx+','+ny+','+nm;if(seen.has(k))continue;seen.add(k);q.push([nx,ny,nm,d+1]);}}
  return 99;
}
NIVS.forEach(nv=>LEVELS[nv.n].forEach(L=>parseLevel(L,nv)));

/* ---------- program model ---------- */
let UID=1; const uid=()=>'n'+(UID++);
function mk(t){const n={id:uid(),t};if(t==='REP'){n.n=2;n.body=[];}if(t==='UNTIL'){n.body=[];}if(t==='IF'){n.c='vrij';n.body=[];n.els=[];}return n;}
function parseProg(str){
  const toks=(str||'').match(/\d+\{|\*\{|\?[a-z]+\{|\}\{|\{|\}|[A-Z]+/g)||[]; let i=0;
  function seq(){const out=[];while(i<toks.length){const t=toks[i];
    if(t==='}'||t==='}{')return out; i++;
    if(/^\d+\{$/.test(t)){const n=mk('REP');n.n=parseInt(t);n.body=seq();i++;out.push(n);}
    else if(t==='*{'){const n=mk('UNTIL');n.body=seq();i++;out.push(n);}
    else if(t[0]==='?'){const n=mk('IF');n.c=t.slice(1,-1);n.body=seq();if(toks[i]==='}{'){i++;n.els=seq();}i++;out.push(n);}
    else out.push(mk(t));}
   return out;}
  return seq();
}
function countBlocks(list){let c=0;for(const n of list){c++;if(n.body)c+=countBlocks(n.body);if(n.els)c+=countBlocks(n.els);}return c;}
function cloneList(list){return list.map(n=>{const c=Object.assign({},n,{id:uid()});if(n.body)c.body=cloneList(n.body);if(n.els)c.els=cloneList(n.els);return c;});}

/* ---------- interpreter (generator) ---------- */
function cellObs(L,x,y){return L.obsMap.get(x+','+y);}
function inside(L,x,y){return x>=0&&y>=0&&x<L.c&&y<L.r;}
function freeCell(L,x,y){return inside(L,x,y)&&!cellObs(L,x,y);}
function sense(L,S,c){
  const f=[S.x+DV[S.d][0],S.y+DV[S.d][1]];
  const rd=(S.d+1)%4,ld=(S.d+3)%4;
  switch(c){
    case 'vrij':return freeCell(L,f[0],f[1]);
    case 'gat':return inside(L,f[0],f[1])&&cellObs(L,f[0],f[1])==='h';
    case 'muur':return !inside(L,f[0],f[1])||HIGH.has(cellObs(L,f[0],f[1]));
    case 'rv':return freeCell(L,S.x+DV[rd][0],S.y+DV[rd][1]);
    case 'lv':return freeCell(L,S.x+DV[ld][0],S.y+DV[ld][1]);
  }return false;
}
function senseCell(S,c){const d=c==='rv'?(S.d+1)%4:c==='lv'?(S.d+3)%4:S.d;return [S.x+DV[d][0],S.y+DV[d][1]];}
function* G_list(list,S,L){for(const nd of list){yield* G_node(nd,S,L);if(S.done)return;}}
function tired(S,nd){S.done=true;S.res='tired';return {k:'tired',nd};}
function* G_move(nd,S,L,dir,jump){
  const [dx,dy]=DV[dir];let tx=S.x+dx,ty=S.y+dy,reason=null;
  if(jump){
    if(!inside(L,tx,ty))reason='wall';
    else if(HIGH.has(cellObs(L,tx,ty)))reason='high';
    else{tx+=dx;ty+=dy;if(!inside(L,tx,ty))reason='wall';else if(cellObs(L,tx,ty))reason='land';}
  } else {
    if(!inside(L,tx,ty))reason='wall';
    else{const o=cellObs(L,tx,ty);if(o==='h')reason='hole';else if(o)reason='obs';}
  }
  if(reason){S.done=true;S.res='bump';yield {k:'bump',nd,reason,dir};return;}
  const from=[S.x,S.y];S.x=tx;S.y=ty;let got=-1;
  const bi=L.bolts.findIndex(b=>b[0]===tx&&b[1]===ty);
  if(bi>=0&&!(S.mask&(1<<bi))){S.mask|=1<<bi;got=bi;}
  const win=tx===L.g[0]&&ty===L.g[1]&&S.mask===L.full;
  if(win){S.done=true;S.res='win';}
  yield {k:'move',nd,from,to:[tx,ty],dir,jump,got,win};
}
function* G_node(nd,S,L){
  if(S.done)return;
  if(++S.steps>LIMIT){yield tired(S,nd);return;}
  const t=nd.t;
  if(t in ABS){yield* G_move(nd,S,L,ABS[t],false);return;}
  switch(t){
    case 'F':yield* G_move(nd,S,L,S.d,false);return;
    case 'B':yield* G_move(nd,S,L,(S.d+2)%4,false);return;
    case 'J':yield* G_move(nd,S,L,S.d,true);return;
    case 'TL':S.d=(S.d+3)%4;S.rot-=90;yield {k:'turn',nd};return;
    case 'TR':S.d=(S.d+1)%4;S.rot+=90;yield {k:'turn',nd};return;
    case 'REP':for(let i=1;i<=nd.n;i++){yield {k:'iter',nd,i,n:nd.n};yield* G_list(nd.body,S,L);if(S.done)return;}return;
    case 'UNTIL':{const seen=new Set();let i=0;
      while(true){const key=S.x+','+S.y+','+S.d+','+S.mask;
        if(seen.has(key)){yield tired(S,nd);return;} seen.add(key);
        if(++S.steps>LIMIT){yield tired(S,nd);return;}
        yield {k:'iter',nd,i:++i};yield* G_list(nd.body,S,L);if(S.done)return;}}
    case 'IF':{const r=sense(L,S,nd.c);yield {k:'check',nd,res:r,cell:senseCell(S,nd.c)};yield* G_list(r?nd.body:nd.els,S,L);return;}
    case 'C':{if(S.depth>6){yield tired(S,nd);return;}S.depth++;yield {k:'call',nd};yield* G_list(S.fn,S,L);S.depth--;return;}
  }
}
function newState(L,fn){return {x:L.s[0],y:L.s[1],d:L.s[2],rot:L.s[2]*90,mask:0,steps:0,depth:0,done:false,res:null,fn:fn||[]};}
function simulate(n,i,mainStr,fnStr){
  const L=LEVELS[n][i];
  const main=L.mode==='abs'?[...mainStr].map(mk):parseProg(mainStr);const fn=parseProg(fnStr||'');
  const S=newState(L,fn);let last=null;for(const ev of G_list(main,S,L)){last=ev;}
  return {res:S.res||'end',blocks:countBlocks(main)+countBlocks(fn),last:last&&last.k,reason:last&&last.reason};
}

const CFG=window.ROBBIE_CONFIG||{};
const SB_URL=String(CFG.supabaseUrl||'').trim(), SB_KEY=String(CFG.supabaseAnonKey||'').trim();
const LK={code:'rr3-code',cache:'rr3-cache',pending:'rr3-pending',gast:'rr3-gast',cur:'rr3-cur',dev:'rr3-dev'};
const HAS_LS=(()=>{try{localStorage.setItem('__rr','1');localStorage.removeItem('__rr');return true;}catch(e){return false;}})();
const MEM={};
function lget(k,d){try{const v=HAS_LS?localStorage.getItem(k):MEM[k];return v?JSON.parse(v):d;}catch(e){return d;}}
function lset(k,v){const s=JSON.stringify(v);try{if(HAS_LS)localStorage.setItem(k,s);else MEM[k]=s;}catch(e){MEM[k]=s;}}
let sb=null;
function emptyProg(){return {stars:{},first:{},last:0,done:{}};}
function computeDone(p){p.stars=p.stars||{};p.first=p.first||{};p.done={};
  [1,2,3].forEach(n=>{const keys=LEVELS[n].map((_,i)=>n+'-'+i);if(keys.every(k=>(p.stars[k]||0)>0))p.done[n]=Math.max(...keys.map(k=>p.first[k]||0))||Date.now();});return p;}
function progFromRows(rows,ids){const prog={};(ids||[]).forEach(id=>prog[id]=emptyProg());
  (rows||[]).forEach(v=>{const p=prog[v.leerling_id]||(prog[v.leerling_id]=emptyProg());p.stars[v.sleutel]=+v.sterren;p.first[v.sleutel]=Date.parse(v.eerst)||0;p.last=Math.max(p.last,Date.parse(v.bijgewerkt)||0);});
  Object.values(prog).forEach(computeDone);return prog;}
const CODECHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
const URLCODE=(()=>{try{return normCode(new URLSearchParams(location.search).get('klas'));}catch(e){return '';}})();
const Store={
  status:'idle', fixed:!!(normCode(CFG.klascode)||URLCODE), code:normCode(CFG.klascode)||URLCODE||lget(LK.code,''),
  klas:null, cfg:{students:[]}, prog:{gast:computeDone(Object.assign(emptyProg(),lget(LK.gast,{})))},
  pending:lget(LK.pending,[]), dev:Object.assign({sound:true,fast:false,speak:'beg'},lget(LK.dev,{})),
  listeners:[], onChange(f){this.listeners.push(f);}, emit(){this.listeners.forEach(f=>{try{f();}catch(e){console.error(e);}});},
  saveDev(){lset(LK.dev,this.dev);},
  student(id){return this.cfg.students.find(s=>s.id===id);},
  p(id){if(!this.prog[id])this.prog[id]=emptyProg();return this.prog[id];},
  applyData(data){
    this.klas=data.klas||null;
    this.cfg.students=(data.leerlingen||[]).map(l=>({id:l.id,name:String(l.naam||''),sym:String(l.symbool||'⭐'),niv:+l.niveau||0}));
    const gast=this.prog.gast;this.prog=progFromRows(data.voortgang,this.cfg.students.map(s=>s.id));this.prog.gast=gast;
    this.pending.forEach(q=>{const p=this.prog[q.l];if(p){p.stars[q.k]=Math.max(p.stars[q.k]||0,q.s);if(!p.first[q.k])p.first[q.k]=q.t||Date.now();computeDone(p);}});
  },
  async load(){
    if(!sb){this.status=(SB_URL&&SB_KEY)?'offline':'noconfig';this.emit();return;}
    if(!this.code){this.status='nocode';this.klas=null;this.cfg.students=[];this.emit();return;}
    if(this.status!=='ok'){this.status='loading';this.emit();}
    try{
      const {data,error}=await sb.rpc('rr_klas',{p_code:this.code});
      if(error)throw error;
      if(!data){this.status='badcode';this.klas=null;this.cfg.students=[];this.emit();return;}
      this.applyData(data);this.status='ok';lset(LK.cache,{code:this.code,data});this.emit();this.flush();
    }catch(e){
      const c=lget(LK.cache,null);if(c&&c.code===this.code&&c.data)this.applyData(c.data);
      this.status='offline';this.emit();
    }
  },
  flushing:false,
  async flush(){
    if(!sb||this.flushing||!this.pending.length)return;this.flushing=true;const rest=[];
    for(const q of this.pending){
      try{const {error}=await sb.rpc('rr_sterren',{p_code:this.code,p_leerling:q.l,p_sleutel:q.k,p_sterren:q.s});
        if(error){if(error.code)continue;throw error;}}
      catch(e){rest.push(q);}
    }
    this.pending=rest;lset(LK.pending,rest);this.flushing=false;
  },
  recordWin(id,key,stars){
    const p=this.p(id);const n=+key[0];const was=!!p.done[n];
    p.stars[key]=Math.max(p.stars[key]||0,stars);if(!p.first[key])p.first[key]=Date.now();p.last=Date.now();computeDone(p);
    if(id==='gast')lset(LK.gast,this.prog.gast);
    else{this.pending.push({l:id,k:key,s:stars,t:Date.now()});lset(LK.pending,this.pending);this.flush();}
    this.emit();return !was&&!!p.done[n];
  },
  setCode(c){this.code=normCode(c);lset(LK.code,this.code);this.status='idle';this.load();}
};

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,d=.12,type='sine',vol=.15,delay=0,slide){if(!Store.dev.sound)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);}
const DT={U:659,R:523,D:392,L:440,F:523,B:392,J:784,TL:440,TR:587};
const SFX={add:d=>tone(DT[d]||600,.11,'triangle',.2),step:d=>{const f=DT[d]||523;tone(f,.08,'square',.05);tone(f*1.5,.08,'square',.045,.08);},
  bump:()=>tone(170,.38,'sawtooth',.16,0,55),collect:()=>{tone(988,.08,'sine',.2);tone(1319,.16,'sine',.2,.08);},
  unlock:()=>[523,659,784].forEach((f,i)=>tone(f,.13,'triangle',.18,i*.09)),fail:()=>{tone(392,.18,'triangle',.18);tone(311,.32,'triangle',.18,.2);},
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.17,'triangle',.2,i*.12)),rotate:()=>tone(560,.08,'triangle',.14,0,900),
  remove:()=>tone(330,.1,'triangle',.14,0,200),turn:()=>tone(700,.07,'sine',.08,0,500),check:r=>tone(r?880:300,.09,'sine',.12),jump:()=>tone(400,.3,'sine',.12,0,1000)};
let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
let ttsCap=null, speechTok=0;
function nlVoice(){return voices.find(v=>/^nl[-_]BE/i.test(v.lang))||voices.find(v=>/^nl/i.test(v.lang));}
function stopSpeech(){speechTok++;try{speechSynthesis.cancel();}catch(e){}try{ttsCap&&ttsCap.stop();}catch(e){}}
function webSpeak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=nlVoice();u.lang=v?v.lang:'nl-BE';if(v)u.voice=v;u.rate=.92;u.pitch=1.12;speechSynthesis.speak(u);}catch(e){}}
function say(text){
  if(!Store.dev.sound||!text)return; stopSpeech(); const tok=speechTok;
  if(!nlVoice() && ttsCap){ ttsCap.speak(text,{language:'nl',rate:.95}).catch(e=>{ if(tok!==speechTok)return; if(e&&e.code==='not_granted')ttsCap=null; if(!e||e.code!=='viewer_stopped')webSpeak(text); }); }

}

function playStory(){
  const tok=++storyTok,lines=STORIES[storyN].lines;stopSpeech();$('stGo').classList.remove('pulse');setScene(0);
  let started=false;
  if(Store.dev.sound&&window.speechSynthesis&&window.SpeechSynthesisUtterance){
    try{speechSynthesis.cancel();const v=nlVoice();
      lines.forEach((ln,i)=>{const u=new SpeechSynthesisUtterance(ln.t);u.lang=v?v.lang:'nl-BE';if(v)u.voice=v;u.rate=.86;u.pitch=1.12;
        u.onstart=()=>{if(tok!==storyTok)return;started=true;setScene(i);};
        u.onend=()=>{if(tok===storyTok&&i===lines.length-1)setScene(i);};
        speechSynthesis.speak(u);});
    }catch(e){}
  }
  setTimeout(()=>{if(tok!==storyTok||started)return;let i=0;const next=()=>{if(tok!==storyTok)return;setScene(i);if(i<lines.length-1){i++;setTimeout(next,4000);}};next();},1500);

function renderStrip(addedAt){let h='';for(let i=0;i<L.slots;i++){if(i<P.main.length)h+=`<button class="blk ${P.main[i].t}${i===addedAt?' added':''}" data-i="${i}" data-id="${P.main[i].id}">${arrowSVG(P.main[i].t)}</button>`;else h+=`<div class="eslot"></div>`;}$('strip').innerHTML=h;}
$('strip').addEventListener('click',e=>{const b=e.target.closest('.blk');if(!b||busy)return;ac();const i=+b.dataset.i;
  P.main[i].t={U:'R',R:'D',D:'L',L:'U'}[P.main[i].t];SFX.rotate();edited();const nb=$('strip').querySelector(`.blk[data-i="${i}"]`);if(nb)nb.classList.add('added');});

/* ----- tree editor ----- */
function indexLists(){lists={m:P.main,f:P.fn};parentOf={};
  const walk=(list,lid)=>list.forEach((n,i)=>{parentOf[n.id]={lid,idx:i};if(n.body){lists[n.id+'b']=n.body;walk(n.body,n.id+'b');}if(n.els){lists[n.id+'e']=n.els;walk(n.els,n.id+'e');}});
  walk(P.main,'m');walk(P.fn,'f');
  if(!lists[cursor.lid]){cursor={lid:'m',idx:P.main.length};}
  cursor.idx=Math.max(0,Math.min(cursor.idx,lists[cursor.lid].length));}
function nodeHTML(n){
  const b=BLK[n.t]; const sel=(parentOf[n.id]&&parentOf[n.id].lid===cursor.lid&&parentOf[n.id].idx===cursor.idx-1)?' sel':'';
  if(n.t==='REP') return `<div class="nd cont${sel}" data-id="${n.id}" style="--bc:${b.col}"><div class="hd"><span class="ic">${BI.REP}</span>herhaal <button class="chip cntc" data-id="${n.id}">${n.n}</button> keer <span class="itb" data-it="${n.id}"></span></div><div class="bd">${listHTML(n.body,n.id+'b')}</div></div>`;
  if(n.t==='UNTIL') return `<div class="nd cont${sel}" data-id="${n.id}" style="--bc:${b.col}"><div class="hd"><span class="ic">${BI.UNTIL}</span>herhaal tot bij <span style="width:26px;height:26px;display:inline-block">${goalArt(L.niv)}</span><span class="itb" data-it="${n.id}"></span></div><div class="bd">${listHTML(n.body,n.id+'b')}</div></div>`;
  if(n.t==='IF') return `<div class="nd cont${sel}" data-id="${n.id}" style="--bc:${b.col}"><div class="hd"><span class="ic">${BI.IF}</span>als <button class="chip condc" data-id="${n.id}">${CONDS[n.c]}</button><span class="res" data-res="${n.id}"></span></div><div class="bd">${listHTML(n.body,n.id+'b')}</div><div class="mid" data-id="${n.id}">anders</div><div class="bd">${listHTML(n.els,n.id+'e')}</div></div>`;
  return `<div class="nd prim${sel}" data-id="${n.id}" style="--bc:${b.col}"><span class="ic">${BI[n.t]}</span>${b.lab}</div>`;
}
function listHTML(list,lid){let h='';list.forEach((n,i)=>{if(cursor.lid===lid&&cursor.idx===i)h+='<div class="cur"></div>';h+=nodeHTML(n);});
  if(cursor.lid===lid&&cursor.idx===list.length)h+='<div class="cur"></div>';
  if(lid!=='m'&&lid!=='f')h+=`<button class="addslot" data-lid="${lid}" aria-label="Hier toevoegen">+</button>`;
  return h;}
function renderProgram(addedAt){
  if(L.mode==='abs'){renderStrip(addedAt);return;}
  indexLists();
  $('codeMain').innerHTML=listHTML(P.main,'m')+(P.main.length?'':'<div class="emptyhint">Tik op de blokken hierboven om een programma te maken.</div>')+`<button class="addslot" data-lid="m" aria-label="Achteraan toevoegen">+</button>`;
  if(L.fn)$('codeFn').innerHTML=listHTML(P.fn,'f')+`<button class="addslot" data-lid="f" aria-label="Achteraan toevoegen in functie">+</button>`;
  renderCount();
  const c=$('codeWrap').querySelector('.cur');if(c&&c.scrollIntoView){try{c.scrollIntoView({block:'nearest'});}catch(e){}}
}
function codeClick(e){
  if(busy)return;ac();
  const cnt=e.target.closest('.cntc');if(cnt){const n=findNode(cnt.dataset.id);n.n=n.n>=10?2:n.n+1;SFX.rotate();edited();return;}
  const cd=e.target.closest('.condc');if(cd){const n=findNode(cd.dataset.id);const cl=L.conds;n.c=cl[(cl.indexOf(n.c)+1)%cl.length];SFX.rotate();edited();return;}
  const sl=e.target.closest('.addslot');if(sl){cursor={lid:sl.dataset.lid,idx:lists[sl.dataset.lid].length};SFX.turn();renderProgram();return;}
  const md=e.target.closest('.mid');if(md){cursor={lid:md.dataset.id+'e',idx:0};SFX.turn();renderProgram();return;}
  const nd=e.target.closest('.prim, .cont>.hd');if(nd){const id=nd.closest('.nd').dataset.id;const p=parentOf[id];cursor={lid:p.lid,idx:p.idx+1};SFX.turn();renderProgram();}
}
$('codeMain').addEventListener('click',codeClick);$('codeFn').addEventListener('click',codeClick);
function findNode(id){let f=null;const w=l=>l.forEach(n=>{if(n.id===id)f=n;if(n.body)w(n.body);if(n.els)w(n.els);});w(P.main);w(P.fn);return f;}
function insertNode(t){
  if(t==='C'&&cursor.lid!=='m'&&isInFn(cursor.lid)){say("Een functie kan zichzelf niet oproepen. Zet dit blok in het programma.");shakeEl($('codeWrap'));return;}
  if(countBlocks(P.main)+countBlocks(P.fn)>=L.max){SFX.bump();shakeEl($('blkCount'));say(`Je mag maar ${L.max} blokken gebruiken.`);return;}
  const n=mk(t);if(t==='IF')n.c=L.conds[0];
  lists[cursor.lid].splice(cursor.idx,0,n);
  if(n.body)cursor={lid:n.id+'b',idx:0};else cursor.idx++;
  SFX.add(t);edited();
}
function isInFn(lid){if(lid==='f')return true;if(lid==='m')return false;const id=lid.slice(0,-1);const p=parentOf[id];return p?isInFn(p.lid):false;}
function shakeEl(el){el.classList.remove('shakeit');void el.offsetWidth;el.classList.add('shakeit');}
function deleteAtCursor(){
  if(L.mode==='abs'){if(!P.main.length)return;P.main.pop();SFX.remove();edited();return;}
  const list=lists[cursor.lid];
  if(cursor.idx>0){list.splice(cursor.idx-1,1);cursor.idx--;SFX.remove();edited();return;}
  if(cursor.lid!=='m'&&cursor.lid!=='f'){const p=parentOf[cursor.lid.slice(0,-1)];if(p){cursor={lid:p.lid,idx:p.idx+1};SFX.turn();renderProgram();}}
}
function edited(addedAt){stepGen=null;renderProgram(addedAt);resetAll();}

function updateHints(){document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));if(busy)return;
  if(L.niv===1&&curLvl===0&&P.main.length<L.opt&&!hasRun)document.querySelector('.arw.R').classList.add('pulse');

let stepRunning=false;

const BUMPTXT={wall:"Au! Daar is de rand van het veld.",obs:"Botsing! Daar staat iets in de weg.",hole:"Stop! Daar is een gat. Robbie moet erover springen.",high:"Te hoog! Over kisten en kasten kan Robbie niet springen.",land:"Robbie kan daar niet landen."};
async function animate(ev){
  const k=ev.k, sp=spd();
  robotEl.style.setProperty('--mv',(.36*sp)+'s');robotEl.querySelector('.face').style.setProperty('--tv',(.28*sp)+'s');
  if(k==='iter'){const el=document.querySelector(`[data-it="${ev.nd.id}"]`);if(el){el.classList.add('on');el.textContent=ev.n?ev.i+' / '+ev.n:'ronde '+ev.i;}marks(ev.nd.id,null);await sleep(140*sp);return;}
  if(k==='call'){marks(ev.nd.id,null);SFX.turn();await sleep(260*sp);return;}
  if(k==='check'){marks(ev.nd.id,null);const r=document.querySelector(`[data-res="${ev.nd.id}"]`);if(r){r.className='res on '+(ev.res?'y':'n');r.textContent=ev.res?'ja':'nee';}
    const [cx,cy]=ev.cell;if(cx>=0&&cy>=0&&cx<L.c&&cy<L.r){const sc=piece('scan'+(ev.res?'':' no'),cx,cy,'');setTimeout(()=>sc.remove(),Math.max(300,500*sp));}
    SFX.check(ev.res);await sleep(420*sp);return;}
  if(k==='turn'){marks(ev.nd.id,null);setFacing();SFX.turn();await sleep(380*sp);return;}
  if(k==='tired'){marks(null,ev.nd.id);bubble('Zzz',true);SFX.fail();say("Robbie loopt in rondjes en stopt nooit. Dat is een oneindige lus! Zoek de fout.");return;}
  if(k==='bump'){marks(null,ev.nd.id);const [dx,dy]=DV[ev.dir];
    robotEl.querySelector('.rb').animate([{transform:'none'},{transform:`translate(${dx*cs*.38}px,${dy*cs*.38}px)`},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'none'}],{duration:520,easing:'ease-out'});
    SFX.bump();bubble('!',true);say(BUMPTXT[ev.reason]);await sleep(520);return;}
  if(k==='move'){marks(ev.nd.id,null);
    if(L.mode==='abs'){const img=robotEl.querySelector('img');if(ev.dir===3)img.style.transform='scaleX(-1)';else if(ev.dir===1)img.style.transform='';}
    const dot=piece('dot',ev.from[0],ev.from[1],'<i></i>');dot.style.setProperty('--col',L.mode==='abs'?`var(--${'URDL'[ev.dir]})`:BLK[ev.nd.t].col);
    setPos(robotEl,ev.to[0],ev.to[1]);
    robotEl.querySelector('.rb').animate([{transform:'translateY(0)'},{transform:`translateY(${ev.jump?-55:-14}%)`},{transform:'translateY(0)'}],{duration:(ev.jump?420:380)*sp,easing:'ease-in-out'});
    if(ev.jump)SFX.jump();else SFX.step(ev.nd.t);
    await sleep((ev.jump?470:410)*sp);
    if(ev.got>=0){boltEls[ev.got].classList.add('got');SFX.collect();renderGoalStrip();if(S.mask===L.full){goalEl.classList.remove('locked');goalEl.classList.add('unlock');setTimeout(SFX.unlock,180);}}
    await sleep(Math.max(0,(L.mode==='abs'?200:120)*sp));return;}
}
function notArrived(){marks(null,null);
  if(S.x===L.g[0]&&S.y===L.g[1]&&S.mask!==L.full){boltEls.forEach((b,i)=>{if(!(S.mask&(1<<i)))b.classList.add('flash');});say("Robbie is er, maar hij is een bout vergeten!");}
  else say(L.niv===1?"Robbie is nog niet bij de batterij. Probeer nog eens!":"Het programma is klaar, maar Robbie is nog niet bij het doel. Probeer nog eens!");
  bubble('?');SFX.fail();}
async function run(){
  if(busy&&!stepRunning){stopFlag=true;return;}
  if(busy)return;ac();
  if(!P.main.length){say(L.niv===1?"Leg eerst pijlen voor Robbie.":"Maak eerst een programma.");if(L.mode==='abs')document.querySelectorAll('.arw').forEach(a=>a.classList.add('pulse'));return;}
  stopSpeech();resetRobot();stepGen=null;hasRun=true;stopFlag=false;setBusy(true);await sleep(200);
  const gen=G_list(P.main,S,L);
  for(const ev of gen){if(stopFlag||!game.classList.contains('on')){setBusy(false);resetRobot();return;}await animate(ev);}
  await finishRun();
}
async function finishRun(){
  if(S.res==='win'){await win();return;}
  setBusy(false);if(S.res!=='bump'&&S.res!=='tired')notArrived();
}
async function step(){
  if(busy)return;ac();
  if(!P.main.length){say("Maak eerst een programma.");return;}
  if(!stepGen||stepDone){resetRobot();S.fn=P.fn;stepGen=G_list(P.main,S,L);stepDone=false;}
  hasRun=true;stepRunning=true;setBusy(true);
  while(true){const r=stepGen.next();if(r.done){stepDone=true;break;}await animate(r.value);if(['move','turn','bump','tired','check'].includes(r.value.k))break;}
  stepRunning=false;
  if(S.done||stepDone){stepDone=true;if(S.res==='win'){await win();return;}setBusy(false);if(S.res!=='bump'&&S.res!=='tired')notArrived();return;}
  setBusy(false);
}

$('btnClear').addEventListener('click',()=>{if(busy)return;ac();if(!P.main.length&&!P.fn.length)return;P.main.length=0;P.fn.length=0;cursor={lid:'m',idx:0};SFX.remove();edited();});

async function win(){
  marks(null,null);goalEl.classList.remove('locked','unlock');goalEl.classList.add('charged');robotEl.classList.add('dance');SFX.win();confetti();
  say(L.niv===1?"Joepie! Robbie heeft de batterij!":L.niv===2?"Super! Weer een raketonderdeel gevonden!":"Chip hersteld! De Glitch wordt zwakker!");
  let n;if(L.mode==='abs'){const len=P.main.length;n=len<=L.opt?3:(len<=L.opt+2?2:1);}
  else{const b=countBlocks(P.main)+countBlocks(P.fn);n=b<=L.best?3:(b<=L.best+2?2:1);}
  const newlyDone=Store.recordWin(sidNow(),curNiv+'-'+curLvl,n);
  await sleep(1300);if(!game.classList.contains('on'))return;
  const bs=$('bigStars');bs.innerHTML='';
  for(let k=0;k<3;k++){const w=document.createElement('div');w.innerHTML=ART.star(k<n);const sv=w.firstChild;sv.style.animationDelay=(k*.25)+'s';bs.appendChild(sv);setTimeout(()=>{if(k<n)tone(784+k*200,.12,'triangle',.18);},k*250+200);}
  const p=Store.p(sidNow());
  winNextAction = newlyDone ? 'finale' : (curLvl<LEVELS[curNiv].length-1 ? 'next' : (p.done[curNiv]?'finale':'map'));
  $('wNext').innerHTML = winNextAction==='finale'?ART.diploma:ICON.next;
  $('winOv').classList.add('on');
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(!game.classList.contains('on')||document.querySelector('.ov.on')||$('tPanel').classList.contains('on'))return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const m={ArrowUp:'U',ArrowRight:'R',ArrowDown:'D',ArrowLeft:'L'}[e.key];
  if(m&&L.mode==='abs'){e.preventDefault();if(!busy)addAbs(m);}
  else if(m&&L.mode!=='abs'){e.preventDefault();const t={U:'F',D:'B',L:'TL',R:'TR'}[m];if(!busy&&L.blocks.includes(t))insertNode(t);}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();run();}
  else if(e.key==='Backspace'){e.preventDefault();$('btnUndo').click();}
  else if(e.key==='s'||e.key==='S'){step();}
});

let dipCtx=null, robbieImg=new Image(); robbieImg.src=ROBBIE;
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>window.jspdf?res(window.jspdf):rej();s.onerror=rej;document.head.appendChild(s);});}
function wrapText(ctx,text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=t;}ctx.fillText(line,x,y);return y;}
async function drawDiploma(name,n,starCount,date){
  try{await document.fonts.load('700 60px Fredoka');await document.fonts.load('500 30px Fredoka');}catch(e){}
  const nv=NIVS[n-1],W=1754,H=1240,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F=(w,s)=>`${w} ${s}px Fredoka, "Trebuchet MS", sans-serif`;
  x.fillStyle='#fffdf5';x.fillRect(0,0,W,H);
  x.strokeStyle=nv.color;x.lineWidth=26;x.strokeRect(40,40,W-80,H-80);x.strokeStyle='#1e1b4b';x.lineWidth=6;x.strokeRect(78,78,W-156,H-156);
  // gears in corners
  const gear=(cx,cy,r,col)=>{x.save();x.fillStyle=col;x.beginPath();const p=new Path2D(gearPath(cx,cy,r,r*.8,12));x.fill(p);x.fillStyle='#fffdf5';x.beginPath();x.arc(cx,cy,r*.35,0,7);x.fill();x.restore();};
  gear(150,150,60,nv.color);gear(W-150,150,60,nv.color);gear(150,H-150,60,nv.color);gear(W-150,H-150,60,nv.color);
  x.textAlign='center';x.fillStyle='#1e1b4b';x.font=F(700,130);x.fillText('DIPLOMA',W/2+120,250);
  x.font=F(500,40);x.fillStyle='#4338ca';x.fillText('Robbie in Robotland · '+nv.dipTitle,W/2+120,315);
  // robbie
  if(robbieImg.complete){const ih=560,iw=ih*robbieImg.width/robbieImg.height;x.drawImage(robbieImg,170,330,iw,ih);}
  x.font=F(500,38);x.fillStyle='#334155';x.fillText('Dit diploma is voor',W/2+120,420);
  x.font=F(700,104);x.fillStyle=nv.color;x.strokeStyle='#1e1b4b';x.lineWidth=3;x.fillText(name||'__________',W/2+120,540);x.strokeText(name||'',W/2+120,540);
  x.font=F(500,38);x.fillStyle='#1e293b';
  wrapText(x,`heeft niveau ${n} · ${nv.name} – “${nv.title}” helemaal opgelost en kan nu:`,W/2+120,625,1000,50);
  x.textAlign='left';x.font=F(500,36);let y=730;
  nv.concepts.forEach(t=>{x.fillStyle=nv.color;x.beginPath();x.arc(700,y-12,12,0,7);x.fill();x.fillStyle='#1e293b';x.fillText(t,730,y);y+=58;});
  x.textAlign='center';x.font=F(600,40);x.fillStyle='#a16207';x.fillText(`★ ${starCount} van de ${LEVELS[n].length*3} sterren`,W/2+120,y+40);
  // footer
  x.font=F(500,32);x.fillStyle='#334155';x.textAlign='left';x.fillText(date,200,H-190);
  x.strokeStyle='#94a3b8';x.lineWidth=3;x.beginPath();x.moveTo(1150,H-200);x.lineTo(1560,H-200);x.stroke();
  x.textAlign='center';x.fillText('juf / meester',1355,H-160);
  // stamp

const Teacher={
  user:null, classes:[], sel:null, students:[], prog:{},
  async session(){if(!sb)return null;try{const {data}=await sb.auth.getSession();this.user=data&&data.session?data.session.user:null;}catch(e){this.user=null;}return this.user;},
  async isTeacher(){try{const {data,error}=await sb.rpc('rr_is_leerkracht');return !error&&data===true;}catch(e){return false;}},
  async login(email,pw){const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;this.user=data.user;},
  async logout(){try{await sb.auth.signOut();}catch(e){}this.user=null;},
  async loadClasses(){
    const {data,error}=await sb.from('klassen').select('*').order('naam');if(error)throw error;this.classes=data||[];
    if(!this.sel||!this.classes.find(c=>c.id===this.sel))this.sel=((this.classes.find(c=>c.code===Store.code))||this.classes[0]||{}).id||null;
  },
  async loadSel(){
    this.students=[];this.prog={};if(!this.sel)return;
    const {data:st,error}=await sb.from('leerlingen').select('*').eq('klas_id',this.sel).order('volgorde').order('naam');if(error)throw error;
    this.students=st||[];const ids=this.students.map(s=>s.id);let rows=[];
    if(ids.length){const {data:v,error:e2}=await sb.from('voortgang').select('*').in('leerling_id',ids);if(e2)throw e2;rows=v||[];}
    this.prog=progFromRows(rows,ids);
  },
  async refresh(){await this.loadClasses();await this.loadSel();},
  selClass(){return this.classes.find(c=>c.id===this.sel)||null;},
  async afterChange(){await this.refresh();const c=this.selClass();if(c&&c.code===Store.code)Store.load();renderPanel();}
};

  if(d.del){if(!d.armed){d.armed='1';t.textContent='zeker?';return;}await tRun(async()=>{const {error}=await sb.from('leerlingen').delete().eq('id',d.del);if(error)throw error;await Teacher.afterChange();});return;}
  if(d.sym){const g=document.querySelector(`[data-grid="${d.sym}"]`);const used=new Set(Teacher.students.map(s=>s.symbool));
    g.innerHTML=SYMS.map(y=>`<button data-pick="${esc(d.sym)}" data-y="${y}" class="${used.has(y)?'taken':''}">${y}</button>`).join('');g.style.display=g.style.display==='none'?'grid':'none';return;}
  if(d.pick){await tRun(async()=>{const {error}=await sb.from('leerlingen').update({symbool:d.y}).eq('id',d.pick);if(error)throw error;await Teacher.afterChange();});return;}
  if(t.id==='sAdd'){await tRun(async()=>{const {error}=await sb.from('leerlingen').insert({klas_id:Teacher.sel,naam:'Nieuwe leerling',symbool:freeSym(),volgorde:Teacher.students.length});if(error)throw error;await Teacher.afterChange();});return;}
  if(t.id==='sPasteGo'){const names=$('sPaste').value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,60);if(!names.length)return;
    await tRun(async()=>{const used=new Set(Teacher.students.map(s=>s.symbool));const rows=names.map((n,i)=>{const sym=SYMS.find(y=>!used.has(y))||SYMS[i%SYMS.length];used.add(sym);return {klas_id:Teacher.sel,naam:n.slice(0,40),symbool:sym,volgorde:Teacher.students.length+i};});
      const {error}=await sb.from('leerlingen').insert(rows);if(error)throw error;await Teacher.afterChange();},`${names.length} leerling(en) toegevoegd.`);return;}
  if(t.id==='dLink'){Store.setCode($('dSel').value);renderPanel();tMsg('Dit toestel is gekoppeld.');return;}
  if(t.id==='dUnlink'){Store.setCode('');renderPanel();return;}
  if(t.id==='dGast'){Store.prog.gast=emptyProg();lset(LK.gast,Store.prog.gast);tMsg('Gast-sterren gewist.');return;}
});
$('tBody').addEventListener('change',async e=>{const t=e.target,d=t.dataset;
  if(t.id==='tSel'){Teacher.sel=t.value;await tRun(()=>Teacher.loadSel());renderPanel();return;}
  if(d.kname){await tRun(async()=>{const {error}=await sb.from('klassen').update({naam:t.value.trim().slice(0,60)||'Klas'}).eq('id',d.kname);if(error)throw error;await Teacher.afterChange();},'Bewaard.');return;}
  if(d.name){await tRun(async()=>{const {error}=await sb.from('leerlingen').update({naam:t.value.trim().slice(0,40)||'Leerling'}).eq('id',d.name);if(error)throw error;await Teacher.afterChange();},'Bewaard.');return;}
  if(d.niv){await tRun(async()=>{const {error}=await sb.from('leerlingen').update({niveau:+t.value}).eq('id',d.niv);if(error)throw error;await Teacher.afterChange();},'Bewaard.');return;}
  if(t.id==='dSpeak'){Store.dev.speak=t.value;Store.saveDev();tMsg('Bewaard.');}
});
function freeSym(){const used=new Set(Teacher.students.map(s=>s.symbool));return SYMS.find(s=>!used.has(s))||SYMS[Math.floor(Math.random()*SYMS.length)];}

[$('btnSound'),$('btnSound2')].forEach(b=>b.addEventListener('click',()=>{Store.dev.sound=!Store.dev.sound;Store.saveDev();renderSoundBtns();if(Store.dev.sound){ac();SFX.unlock();}else stopSpeech();}));
$('btnTeach').innerHTML=ICON.lock;$('btnMap').innerHTML=ICON.map;$('btnBackNivs').innerHTML=ICON.back;$('btnStory').innerHTML=ICON.speaker;$('btnSay').innerHTML=ICON.speaker;$('btnRestart').innerHTML=ICON.restart;
$('btnStep').innerHTML=ICON.step;$('btnUndo').innerHTML=ICON.undo;$('btnClear').innerHTML=ICON.trash;$('btnSpeed').innerHTML=Store.dev.fast?ICON.fast:ICON.slow;
$('wRetry').innerHTML=ICON.restart;$('stReplay').innerHTML=ICON.restart;$('stGo').innerHTML=ICON.play;$('wMap').innerHTML=ICON.map;$('bugTag').innerHTML=ART.bug.replace(/^<svg[^>]*>|<\/svg>$/g,'');
$('btnMapDip').innerHTML=`${ART.diploma.replace('<svg','<svg width="30" height="30"')} Diploma`;$('btnMapFinale').innerHTML=`${ICON.play.replace('<svg','<svg width="26" height="26"')} Einde van het verhaal`;
$('finDip').innerHTML=`${ART.diploma.replace('<svg','<svg width="30" height="30"')} Mijn diploma`;$('finMap').innerHTML='Terug';
document.querySelectorAll('img[data-robbie]').forEach(i=>{i.src=ROBBIE;});
updatePlayBtn();buildBG();renderSoundBtns();
try{if(window.supabase&&SB_URL&&SB_KEY)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:HAS_LS,autoRefreshToken:true,detectSessionInUrl:false}});}catch(e){sb=null;}
Store.onChange(()=>{if($('home').classList.contains('on'))renderHome();if($('nivs').classList.contains('on'))renderNivs();});
renderHome();Store.load();
window.addEventListener('online',()=>Store.load());
window.__T={NIVS,LEVELS,simulate,parseProg,countBlocks,startLevel,Store,Teacher,openDiploma,drawDiploma,showFinale};
})();
