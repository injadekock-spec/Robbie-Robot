<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robbie's Schaakkasteel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: warm, speels en helder, voor een slimme zevenjarige die zelfstandig werkt
IDEA: een schaakkasteel van hout, met Robbie als gids en Bobbie als speelmaat
PICTURE: het houten schaakbord is altijd het grote middelpunt van het scherm
COLOUR and TYPE: walnoothout, esdoorn, Robbie-rood, Bobbie-blauw, goud voor sterren; Fredoka + Nunito
LAYOUT: bord links en paneel rechts op een chromebook, onder elkaar op smalle schermen
*/
:root{color-scheme:light dark;
  --bg:light-dark(#fbf6ee,#17120e);--ink:light-dark(#2b2118,#f4ead9);--zacht:light-dark(#6f5d4c,#c9b9a4);
  --kaart:light-dark(#ffffff,#241c16);--lijn:light-dark(#eadfce,#3b3027);
  --hout:#5b3a22;--hout2:#7a4f2e;--licht:#f0d9b5;--donker:#b58863;
  --robbie:#e4572e;--bobbie:#2d7dd2;--goud:#f2b705;--goed:#2f9e44;--fout:#d62839;
  --r:16px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,button,.titel{font-family:Fredoka,Nunito,system-ui,sans-serif}
h1{font-size:clamp(30px,4.5vw,46px);line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:clamp(24px,3vw,30px);line-height:1.1;margin:0 0 8px;font-weight:600}
h3{font-size:19px;margin:0;font-weight:600}
p{margin:0 0 8px}
button{font:600 18px/1.1 Fredoka,system-ui,sans-serif;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:10px 18px;color:inherit;background:var(--kaart);box-shadow:0 2px 0 var(--lijn),0 0 0 2px var(--lijn) inset;transition:transform .12s}
button:active{transform:translateY(2px)}
button:focus-visible,.vak:focus-visible,input:focus-visible{outline:3px solid var(--bobbie);outline-offset:2px}
button:disabled{opacity:.45;cursor:default;transform:none}
.knop-hoofd{background:var(--robbie);color:#fff;box-shadow:0 4px 0 #9e3518}
.knop-blauw{background:var(--bobbie);color:#fff;box-shadow:0 4px 0 #1b5aa0}
.knop-goud{background:var(--goud);color:#3a2a00;box-shadow:0 4px 0 #b37f00}
.knop-klein{min-height:44px;font-size:16px;padding:8px 14px}
.ikoon{width:24px;height:24px;vertical-align:middle;flex:none}
input{font:600 20px Nunito,system-ui;padding:12px 14px;border-radius:12px;border:2px solid var(--lijn);background:var(--kaart);color:var(--ink);width:100%}

/* kop */
.kop{background:var(--hout);color:#fbefdc;padding:10px max(3vw,14px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.kop .naam{font:700 20px Fredoka,sans-serif;display:flex;align-items:center;gap:8px;margin-right:auto}
.kop svg.logo{width:34px;height:34px}
.kop button{background:#7a4f2e;color:#fbefdc;box-shadow:none;min-height:44px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 17px Fredoka,sans-serif;background:#7a4f2e;border-radius:999px;padding:6px 12px;white-space:nowrap}
.chip.sync{font:600 13px Nunito,sans-serif;opacity:.9}
.terug{display:inline-flex;align-items:center;gap:4px}

main{padding:clamp(14px,2.5vw,32px) max(3vw,14px);max-width:1240px;margin:0 auto}

/* sprekers */
.spreek{display:flex;gap:10px;align-items:flex-start}
.spreek svg.av{width:64px;height:64px;flex:none}
.ballon{position:relative;background:var(--kaart);border-radius:18px;padding:12px 48px 12px 16px;box-shadow:0 0 0 2px var(--lijn) inset;flex:1;font-size:18px;font-weight:700}
.spreek.robbie .ballon{box-shadow:0 0 0 3px #f3b6a2 inset}
.spreek.bobbie .ballon{box-shadow:0 0 0 3px #a9cdf2 inset}
.ballon::before{content:"";position:absolute;left:-9px;top:20px;border:9px solid transparent;border-left:0;border-right-color:var(--lijn)}
.ballon p{margin:0}
.lees{position:absolute;right:6px;top:6px;min-height:38px;width:38px;padding:0;display:grid;place-items:center;box-shadow:none;background:transparent;color:var(--zacht)}
.lees svg{width:24px;height:24px}

/* start */
.start{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--hout);background-image:radial-gradient(circle at 20% 0%,#7a4f2e 0,transparent 55%),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 40px)}
.startkaart{background:var(--bg);border-radius:28px;padding:clamp(22px,4vw,40px);width:min(100%,620px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.duo{display:flex;justify-content:center;gap:4px;margin:-70px 0 6px}
.duo svg{width:110px;height:110px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.startkaart h1{text-align:center;margin-bottom:6px}
.startkaart .sub{text-align:center;color:var(--zacht);margin-bottom:20px}
.rij{display:flex;gap:10px;flex-wrap:wrap}
.rij>*{flex:1 1 200px}
.kol{display:grid;gap:12px}
.link{background:none;box-shadow:none;color:var(--zacht);text-decoration:underline;font:700 16px Nunito,sans-serif;min-height:44px}
.leerlingen{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:4px}
.leerlingen button{display:grid;gap:4px;place-items:center;min-height:84px;font-size:17px}
.leerlingen .sym{font-size:30px;line-height:1}
.prentjes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.prentjes button{font-size:40px;min-height:86px;padding:0}
.codevak{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.codevak span{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:36px;background:var(--kaart);box-shadow:0 0 0 2px var(--lijn) inset}
.melding{padding:10px 14px;border-radius:12px;background:light-dark(#fff1e6,#3a2516);font-weight:700}
.melding.fout{background:light-dark(#ffe3e3,#3b1a1d)}

/* kaart */
.welkom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:22px}
.welkom h1{margin-bottom:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--kaart);border-radius:14px;padding:10px 14px;box-shadow:0 0 0 2px var(--lijn) inset;font-weight:800;display:flex;align-items:center;gap:8px}
.stat b{font:700 24px Fredoka,sans-serif}
.werelden{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.wkaart{position:relative;text-align:left;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:0;overflow:hidden;min-height:190px;background:var(--kaart);border-radius:20px;box-shadow:0 4px 0 var(--lijn),0 0 0 2px var(--lijn) inset}
.wkaart .plaat{height:92px;display:grid;place-items:center;background:var(--wk);position:relative}
.wkaart .plaat svg{width:70px;height:70px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.wkaart .plaat .nr{position:absolute;left:10px;top:8px;font:700 15px Fredoka,sans-serif;color:#fff;background:rgba(0,0,0,.22);border-radius:999px;padding:2px 10px}
.wkaart .tekst{padding:0 14px}
.wkaart .voet{padding:0 14px 12px;display:flex;align-items:center;gap:8px;color:var(--zacht);font:700 15px Nunito,sans-serif}
.balk{height:10px;border-radius:99px;background:var(--lijn);overflow:hidden;flex:1}
.balk i{display:block;height:100%;background:var(--goud);border-radius:99px}
.wkaart.op-slot{filter:grayscale(.8);opacity:.6}
.wkaart.op-slot .plaat::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15)}
.wkaart .plaat svg.slotje,.slotje{position:absolute;right:10px;top:8px;color:#fff;width:28px;height:28px;filter:none}
.badge-klaar{position:absolute;right:8px;top:8px;background:var(--goud);color:#3a2a00;border-radius:999px;font:700 13px Fredoka,sans-serif;padding:3px 10px}
.extra{margin-top:26px}
.extra .werelden{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* wereld */
.wkop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:18px}
.wkop .plaat{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:var(--wk)}
.wkop .plaat svg{width:72px;height:72px}
.pad{display:grid;gap:10px;margin-top:16px;max-width:760px}
.stap{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px 14px;border-radius:16px;min-height:68px}
.stap .bol{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--lijn);font:700 20px Fredoka,sans-serif}
.stap.klaar .bol{background:var(--goud);color:#3a2a00}
.stap.baas{box-shadow:0 4px 0 #9e3518,0 0 0 3px var(--robbie) inset}
.stap.baas .bol{background:var(--robbie);color:#fff}
.stap small{display:block;color:var(--zacht);font:700 14px Nunito,sans-serif}
.sterren-mini{display:flex;gap:2px}
.sterren-mini svg{width:24px;height:24px}
.sterren-mini .leeg{opacity:.2;filter:grayscale(1)}

/* activiteit */
.akop{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.akop h2{margin:0;margin-right:auto}
.voortgang{display:flex;gap:6px}
.voortgang i{width:14px;height:14px;border-radius:50%;background:var(--lijn)}
.voortgang i.ok{background:var(--goud)}.voortgang i.nu{background:var(--robbie)}
.speelveld{display:grid;grid-template-columns:minmax(0,auto) minmax(280px,1fr);gap:clamp(14px,2.5vw,32px);align-items:start}
.zijpaneel{display:grid;gap:14px;align-content:start}
.knoppen{display:flex;gap:10px;flex-wrap:wrap}
.vraag{font:600 22px/1.25 Fredoka,sans-serif}
.groot{font:700 clamp(40px,7vw,64px)/1 Fredoka,sans-serif;text-align:center;color:var(--robbie)}
.opties{display:grid;gap:10px}
.opties button{text-align:left;font-size:20px;min-height:56px}
.opties button.goed{background:var(--goed);color:#fff;box-shadow:0 3px 0 #1f6e2f}
.opties button.mis{background:light-dark(#ffe3e3,#3b1a1d);color:var(--fout);text-decoration:line-through}
.teller{font:700 18px Fredoka,sans-serif;color:var(--zacht)}
.uitleg-tekst{font-size:17px}

/* bord */
.bordhouder{width:min(92vw,560px,calc(100vh - 190px));min-width:260px;position:relative}
.bord{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:clamp(6px,1.4vw,12px) solid var(--hout);border-radius:12px;overflow:hidden;box-shadow:0 10px 24px rgba(60,30,10,.28);position:relative;user-select:none;touch-action:manipulation}
.vak{position:relative;aspect-ratio:1;background:var(--donker);border:0;border-radius:0;padding:0;min-height:0;box-shadow:none;display:grid;place-items:center;cursor:pointer}
.vak.l{background:var(--licht)}
.vak .co{position:absolute;font:800 clamp(9px,1.4vw,12px) Nunito,sans-serif;pointer-events:none;opacity:.85}
.vak .co.f{right:3px;bottom:1px}.vak .co.r{left:3px;top:1px}
.vak.l .co{color:var(--donker)}.vak:not(.l) .co{color:var(--licht)}
.vak svg.st{width:88%;height:88%;position:relative;z-index:2;pointer-events:none;transition:transform .35s ease}
svg.st.w{--pf:#fffdf8;--ps:#2b2118;--pd:#2b2118}
svg.st.b{--pf:#2f2620;--ps:#120c08;--pd:#f3e6d0}
svg.st.stuk-geen{display:none}
.vak .ster{width:70%;height:70%;z-index:1;pointer-events:none}
.vak.licht::before{content:"";position:absolute;inset:0;background:rgba(242,183,5,.55)}
.vak.merk::after{content:"";position:absolute;inset:6%;border:4px solid #ff8a1f;border-radius:8px;z-index:3;pointer-events:none}
.vak.kies::before{content:"";position:absolute;inset:0;background:rgba(45,125,210,.55)}
.vak.gekozen::before{content:"";position:absolute;inset:0;background:rgba(45,125,210,.45)}
.vak.laatst::before{content:"";position:absolute;inset:0;background:rgba(242,183,5,.35)}
.vak.gevaar::before{content:"";position:absolute;inset:0;background:rgba(214,40,57,.42)}
.vak.goed::before{content:"";position:absolute;inset:0;background:rgba(47,158,68,.6)}
.vak.fout::before{content:"";position:absolute;inset:0;background:rgba(214,40,57,.6)}
.vak.gemist::after{content:"";position:absolute;inset:8%;border:4px dashed var(--goed);border-radius:50%;z-index:3}
.vak.schaak::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(214,40,57,.9) 0,rgba(214,40,57,.4) 55%,transparent 72%)}
.vak .punt{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(30,30,30,.28);z-index:3;pointer-events:none}
.vak .ring{position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(30,30,30,.3);z-index:3;pointer-events:none}
.bord.schud{animation:schud .35s}
@keyframes schud{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pijlen{position:absolute;inset:0;pointer-events:none;z-index:4}
.waardes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--kaart);padding:16px;border-radius:20px;box-shadow:0 0 0 2px var(--lijn) inset}
.waardes div{display:grid;place-items:center;gap:2px;font:700 16px Fredoka,sans-serif;padding:6px}
.waardes svg{width:64px;height:64px}
.waardes b{font-size:28px;color:var(--robbie)}

.lade{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lade button{width:58px;height:58px;padding:2px;min-height:0;position:relative}
.lade button svg{width:100%;height:100%}
.lade button.aan{box-shadow:0 0 0 4px var(--bobbie) inset}
.lade button span{position:absolute;right:2px;bottom:0;font:700 13px Fredoka,sans-serif;background:var(--kaart);border-radius:8px;padding:0 4px}
.zetlijst{font:700 16px/1.6 Nunito,sans-serif;max-height:180px;overflow:auto;background:var(--kaart);border-radius:14px;padding:10px 14px;box-shadow:0 0 0 2px var(--lijn) inset}
.geslagen{display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-height:30px}
.geslagen svg{width:28px;height:28px}

/* lagen */
#laag:empty{display:none}
.scherm{position:fixed;inset:0;background:rgba(30,18,8,.55);display:grid;place-items:center;z-index:50;padding:16px}
.venster{background:var(--bg);border-radius:24px;padding:clamp(18px,3vw,30px);width:min(100%,560px);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.venster h2{margin-bottom:10px}
.grote-sterren{display:flex;justify-content:center;gap:8px;margin:8px 0 14px}
.grote-sterren svg{width:74px;height:74px;animation:plop .5s backwards}
.grote-sterren svg:nth-child(2){animation-delay:.25s}
.grote-sterren .leeg{opacity:.18;filter:grayscale(1)}
@keyframes plop{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2)}}
.medaille{width:140px;height:140px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--goud) 55%,#b37f00);display:grid;place-items:center;box-shadow:0 6px 0 #8a6200;animation:plop .6s backwards}
.medaille svg{width:90px;height:90px}
.promo{display:flex;gap:10px;justify-content:center}
.promo button{width:80px;height:80px;padding:4px}
.promo svg{width:100%;height:100%}
.keuzes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.keuzes button.aan{background:var(--bobbie);color:#fff;box-shadow:0 3px 0 #1b5aa0}
.gezichten{display:flex;justify-content:center;gap:10px;margin:8px 0 14px}
.gezichten button{font-size:16px;display:grid;gap:4px;place-items:center;min-height:92px;width:120px}
.gezichten button.aan{box-shadow:0 0 0 4px var(--bobbie) inset}
.gezichten .gz{font-size:36px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:val 1.8s ease-in forwards}
@keyframes val{to{transform:translateY(110vh) rotate(720deg)}}

/* tegenstanders */
.tegen{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tegen button{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;text-align:left;align-items:center;min-height:96px}
.tegen button svg{width:64px;height:64px}
.tegen button.aan{box-shadow:0 0 0 4px var(--bobbie) inset}
.tegen small{display:block;font:700 14px Nunito,sans-serif;color:var(--zacht)}
.puzzelrooster{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.puzzelrooster button{min-height:64px;font-size:20px}
.puzzelrooster button.klaar{background:var(--goud);color:#3a2a00;box-shadow:0 3px 0 #b37f00}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button.aan{background:var(--hout);color:#fbefdc;box-shadow:none}

/* leerkracht */
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--kaart);border-radius:14px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:top}
th{font:600 15px Fredoka,sans-serif;background:light-dark(#f3e9da,#2c231c)}
td.num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.paneel{background:var(--kaart);border-radius:18px;padding:16px;box-shadow:0 0 0 2px var(--lijn) inset;display:grid;gap:12px}
label.schakel{display:flex;align-items:center;gap:10px;font-weight:800;min-height:44px}
label.schakel input{width:26px;height:26px}
select{font:700 17px Nunito,sans-serif;padding:10px;border-radius:10px;border:2px solid var(--lijn);background:var(--kaart);color:var(--ink);min-height:44px}

/* diploma */
.diploma{background:#fffaf0;color:#2b2118;border:14px solid var(--hout);outline:4px solid var(--goud);outline-offset:-24px;border-radius:12px;padding:clamp(24px,5vw,56px);text-align:center;max-width:860px;margin:0 auto}
.diploma h1{font-size:clamp(36px,6vw,60px);color:var(--hout)}
.diploma .wie{font:700 clamp(28px,4.5vw,44px) Fredoka,sans-serif;border-bottom:3px dotted #b58863;display:inline-block;min-width:60%;padding:0 10px;margin:10px 0}
.diploma .badges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0}
.diploma .badges span{background:#f3e3c6;border-radius:999px;padding:4px 12px;font:600 15px Fredoka,sans-serif}
.diploma .duo{margin:0}
.diploma .onder{display:flex;justify-content:space-between;gap:20px;margin-top:26px;font-weight:800}
.diploma .onder div{border-top:2px solid #2b2118;padding-top:6px;min-width:180px}

@media (max-width:860px){.speelveld{grid-template-columns:minmax(0,1fr)}.bordhouder{margin:0 auto;width:min(94vw,560px)}}
@media (max-width:600px){body{font-size:16px}.welkom{grid-template-columns:1fr}.welkom .duo{display:none}.spreek svg.av{width:48px;height:48px}.ballon{font-size:17px}.kop .naam span{display:none}.chip.sync{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.kop,.geen-print{display:none!important}body{background:#fff}main{padding:0}.diploma{border-width:10px}}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sP" viewBox="0 0 45 45">

<script>
/* Schaakmotor: alle regels + eenvoudige tegenstander. Vakjes 0..63, a1 = 0, h8 = 63. */
const Schaak = (() => {
  const FILES = 'abcdefgh';
  const WAARDE = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
  const isW = p => p && p === p.toUpperCase();
  const kleur = p => (p ? (isW(p) ? 'w' : 'b') : null);
  const soort = p => (p ? p.toLowerCase() : null);
  const fileOf = s => s & 7, rankOf = s => s >> 3;
  const naam = s => FILES[fileOf(s)] + (rankOf(s) + 1);
  const idx = n => FILES.indexOf(n[0]) + (parseInt(n[1], 10) - 1) * 8;
  const anderen = c => (c === 'w' ? 'b' : 'w');

  const RICHT = {
    r: [[1, 0], [-1, 0], [0, 1], [0, -1]],
    b: [[1, 1], [1, -1], [-1, 1], [-1, -1]],
    n: [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]],
  };
  RICHT.q = RICHT.r.concat(RICHT.b);
  RICHT.k = RICHT.q;
  const glijdt = { r: 1, b: 1, q: 1 };

  function stap(s, df, dr) {
    const f = fileOf(s) + df, r = rankOf(s) + dr;
    return f < 0 || f > 7 || r < 0 || r > 7 ? -1 : r * 8 + f;
  }

  function leesFEN(fen) {
    const [bord, beurt = 'w', rok = '-', ep = '-', half = '0', vol = '1'] = fen.trim().split(/\s+/);
    const b = new Array(64).fill(null);
    bord.split('/').forEach((rij, i) => {
      let f = 0;
      for (const ch of rij) {
        if (/\d/.test(ch)) f += +ch;
        else { b[(7 - i) * 8 + f] = ch; f++; }
      }
    });
    return { b, beurt, rok: rok === '-' ? '' : rok, ep: ep === '-' ? -1 : idx(ep), half: +half, vol: +vol };
  }

  function schrijfFEN(p) {
    let out = [];
    for (let r = 7; r >= 0; r--) {
      let rij = '', leeg = 0;
      for (let f = 0; f < 8; f++) {
        const x = p.b[r * 8 + f];
        if (!x) leeg++;
        else { if (leeg) { rij += leeg; leeg = 0; } rij += x; }
      }
      if (leeg) rij += leeg;
      out.push(rij);
    }
    return `${out.join('/')} ${p.beurt} ${p.rok || '-'} ${p.ep >= 0 ? naam(p.ep) : '-'} ${p.half} ${p.vol}`;
  }

  const kopie = p => ({ b: p.b.slice(), beurt: p.beurt, rok: p.rok, ep: p.ep, half: p.half, vol: p.vol });

  function koningVan(p, c) {
    const k = c === 'w' ? 'K' : 'k';
    return p.b.indexOf(k);
  }

  /* Wordt vakje s aangevallen door kleur c? */
  function aangevallen(p, s, c) {
    const b = p.b;
    const pion = c === 'w' ? 'P' : 'p', dir = c === 'w' ? -1 : 1;
    for (const df of [-1, 1]) {
      const t = stap(s, df, dir);
      if (t >= 0 && b[t] === pion) return true;
    }
    for (const [df, dr] of RICHT.n) {
      const t = stap(s, df, dr);
      if (t >= 0 && b[t] && kleur(b[t]) === c && soort(b[t]) === 'n') return true;
    }
    for (const [df, dr] of RICHT.k) {
      const t = stap(s, df, dr);
      if (t >= 0 && b[t] && kleur(b[t]) === c && soort(b[t]) === 'k') return true;
    }
    for (const [df, dr] of RICHT.q) {
      const recht = df === 0 || dr === 0;
      let t = stap(s, df, dr);
      while (t >= 0) {
        const x = b[t];
        if (x) {
          if (kleur(x) === c) {
            const so = soort(x);
            if (so === 'q' || (recht && so === 'r') || (!recht && so === 'b')) return true;
          }
          break;
        }
        t = stap(t, df, dr);
      }
    }
    return false;
  }

  /* Alle aanvallers van kleur c op vakje s (vakjes) */
  function aanvallers(p, s, c) {
    const uit = [];
    for (let i = 0; i < 64; i++) {
      const x = p.b[i];
      if (!x || kleur(x) !== c) continue;
      if (raakt(p, i, s)) uit.push(i);
    }
    return uit;
  }

  /* Raakt het stuk op vakje van het vakje naar (aanval, los van wie aan zet is)? */
  function raakt(p, van, naar) {
    const x = p.b[van];
    if (!x || van === naar) return false;
    const so = soort(x), c = kleur(x);
    const df = fileOf(naar) - fileOf(van), dr = rankOf(naar) - rankOf(van);
    if (so === 'p') return Math.abs(df) === 1 && dr === (c === 'w' ? 1 : -1);
    if (so === 'n') return (Math.abs(df) === 1 && Math.abs(dr) === 2) || (Math.abs(df) === 2 && Math.abs(dr) === 1);
    if (so === 'k') return Math.max(Math.abs(df), Math.abs(dr)) === 1;
    const recht = df === 0 || dr === 0, schuin = Math.abs(df) === Math.abs(dr);
    if (so === 'r' && !recht) return false;
    if (so === 'b' && !schuin) return false;
    if (so === 'q' && !recht && !schuin) return false;
    const sf = Math.sign(df), sr = Math.sign(dr);
    let t = stap(van, sf, sr);
    while (t !== naar) { if (p.b[t]) return false; t = stap(t, sf, sr); }
    return true;
  }

  function schaak(p, c = p.beurt) {
    const k = koningVan(p, c);
    return k >= 0 && aangevallen(p, k, anderen(c));
  }

  function pseudoZetten(p, alleenVan = -1) {
    const zet = [], b = p.b, c = p.beurt;
    for (let s = 0; s < 64; s++) {
      const x = b[s];
      if (!x || kleur(x) !== c) continue;
      if (alleenVan >= 0 && s !== alleenVan) continue;
      const so = soort(x);
      if (so === 'p') {
        const dir = c === 'w' ? 1 : -1, start = c === 'w' ? 1 : 6, laatste = c === 'w' ? 7 : 0;
        const voeg = (naar, extra = {}) => {
          if (rankOf(naar) === laatste) for (const pr of 'qrbn') zet.push({ van: s, naar, stuk: x, slag: b[naar], promo: c === 'w' ? pr.toUpperCase() : pr, ...extra });
          else zet.push({ van: s, naar, stuk: x, slag: b[naar], ...extra });
        };
        const een = stap(s, 0, dir);
        if (een >= 0 && !b[een]) {
          voeg(een);
          const twee = stap(s, 0, 2 * dir);
          if (rankOf(s) === start && twee >= 0 && !b[twee]) zet.push({ van: s, naar: twee, stuk: x, dubbel: true });
        }
        for (const df of [-1, 1]) {
          const t = stap(s, df, dir);
          if (t < 0) continue;
          if (b[t] && kleur(b[t]) !== c) voeg(t);
          else if (t === p.ep) zet.push({ van: s, naar: t, stuk: x, slag: c === 'w' ? 'p' : 'P', ep: true });
        }
        continue;
      }
      for (const [df, dr] of RICHT[so]) {
        let t = stap(s, df, dr);
        while (t >= 0) {
          if (b[t]) {
            if (kleur(b[t]) !== c) zet.push({ van: s, naar: t, stuk: x, slag: b[t] });
            break;
          }
          zet.push({ van: s, naar: t, stuk: x });
          if (!glijdt[so]) break;
          t = stap(t, df, dr);
        }
      }
      if (so === 'k') {
        const thuis = c === 'w' ? 4 : 60, vijand = anderen(c);
        if (s === thuis && !aangevallen(p, s, vijand)) {
          const K = c === 'w' ? 'K' : 'k', Q = c === 'w' ? 'Q' : 'q', R = c === 'w' ? 'R' : 'r';
          if (p.rok.includes(K) && b[s + 3] === R && !b[s + 1] && !b[s + 2] && !aangevallen(p, s + 1, vijand) && !aangevallen(p, s + 2, vijand))
            zet.push({ van: s, naar: s + 2, stuk: x, rokade: 'K' });
          if (p.rok.includes(Q) && b[s - 4] === R && !b[s - 1] && !b[s - 2] && !b[s - 3] && !aangevallen(p, s - 1, vijand) && !aangevallen(p, s - 2, vijand))
            zet.push({ van: s, naar: s - 2, stuk: x, rokade: 'Q' });
        }
      }
    }
    return zet;
  }

  function doeZet(p, m) {
    const q = kopie(p), b = q.b, c = p.beurt;
    b[m.naar] = m.promo || m.stuk;
    b[m.van] = null;
    if (m.ep) b[m.naar + (c === 'w' ? -8 : 8)] = null;
    if (m.rokade === 'K') { b[m.van + 1] = b[m.van + 3]; b[m.van + 3] = null; }
    if (m.rokade === 'Q') { b[m.van - 1] = b[m.van - 4]; b[m.van - 4] = null; }
    q.ep = m.dubbel ? (m.van + m.naar) / 2 : -1;
    let rok = q.rok;
    const weg = (sq, letters) => { if (m.van === sq || m.naar === sq) for (const l of letters) rok = rok.replace(l, ''); };
    weg(4, 'KQ'); weg(60, 'kq'); weg(0, 'Q'); weg(7, 'K'); weg(56, 'q'); weg(63, 'k');
    q.rok = rok;
    q.half = soort(m.stuk) === 'p' || m.slag ? 0 : p.half + 1;
    if (c === 'b') q.vol = p.vol + 1;
    q.beurt = anderen(c);
    return q;
  }

  function zetten(p, alleenVan = -1) {
    return pseudoZetten(p, alleenVan).filter(m => !schaak(doeZet(p, m), p.beurt));
  }

  /* Doelvakjes van het stuk op s, alsof die kleur aan zet is */
  function doelen(p, s, opties = {}) {
    const x = p.b[s];
    if (!x) return [];
    const q = kopie(p);
    q.beurt = kleur(x);
    if (opties.zonderRokade) q.rok = '';
    const lijst = (opties.pseudo ? pseudoZetten(q, s) : zetten(q, s)).map(m => m.naar);
    return [...new Set(lijst)];
  }

  function genoegMateriaal(p) {
    const stukken = p.b.map((x, i) => [x, i]).filter(([x]) => x && soort(x) !== 'k');
    if (stukken.length === 0) return false;
    if (stukken.length === 1 && 'nb'.includes(soort(stukken[0][0]))) return false;
    if (stukken.every(([x]) => soort(x) === 'b')) {

    x.act[k] = !p ? q : !q ? p : { s: Math.max(p.s, q.s), t: Math.max(p.t || 0, q.t || 0), n: Math.max(p.n || 0, q.n || 0), tijd: Math.min(p.tijd || 9e9, q.tijd || 9e9) };
    if (x.act[k].tijd === 9e9) delete x.act[k].tijd;
  }
  x.refl = { ...a.refl };
  for (const [k, v] of Object.entries(b.refl)) if (!x.refl[k] || (v.t || 0) > (x.refl[k].t || 0)) x.refl[k] = v;
  for (const veld of ['log', 'partijen', 'puzzels']) {
    x[veld] = { ...a[veld] };
    for (const [k, v] of Object.entries(b[veld])) x[veld][k] = Math.max(v, x[veld][k] || 0);
  }
  const fens = new Set();
  x.mijn = [...a.mijn, ...b.mijn].filter(p => !fens.has(p.fen) && fens.add(p.fen));
  for (const k of Object.keys(x.spel)) x.spel[k] = Math.max(a.spel[k] || 0, b.spel[k] || 0);
  const nieuw = (a.bijgewerkt || 0) >= (b.bijgewerkt || 0) ? a : b;
  x.voorlezen = nieuw.voorlezen; x.geluid = nieuw.geluid; x.lopend = nieuw.lopend;
  x.bijgewerkt = Math.max(a.bijgewerkt || 0, b.bijgewerkt || 0);
  return x;
}

async function rpc(fn, body, token) {
  const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: CFG.key, Authorization: 'Bearer ' + (token || CFG.key), 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const t = await r.text();
  if (!r.ok) { const e = new Error(t || r.statusText); e.status = r.status; throw e; }
  return t ? JSON.parse(t) : null;
}

function Bord(houder, opt = {}) {
  houder.innerHTML = '<div class="bordhouder"><div class="bord"></div></div>';
  const el = houder.querySelector('.bord');
  const st = { b: new Array(64).fill(null), om: !!opt.omgedraaid, kleurOm: false, coords: opt.coords !== false, lagen: {}, pijlen: [], ster: new Set(), steen: new Set(), doel: new Set() };
  let tik = null;
  const set = l => new Set((l || []).map(x => (typeof x === 'string' ? S.idx(x) : x)));
  function volgorde() {
    const uit = [];
    for (let rr = 0; rr < 8; rr++) for (let ff = 0; ff < 8; ff++) {
      const r = st.om ? rr : 7 - rr, f = st.om ? 7 - ff : ff;
      uit.push(r * 8 + f);
    }
    return uit;
  }
  function vak(s) {
    const f = S.fileOf(s), r = S.rankOf(s);
    let licht = (f + r) % 2 === 1;
    if (st.kleurOm) licht = !licht;
    const cls = ['vak'];
    if (licht) cls.push('l');
    for (const [n, v] of Object.entries(st.lagen)) if (v.has(s)) cls.push(n);
    let h = '';
    if (st.coords) {
      const onder = st.om ? r === 7 : r === 0, links = st.om ? f === 7 : f === 0;
      if (onder) h += `<span class="co f">${S.FILES[f]}</span>`;
      if (links) h += `<span class="co r">${r + 1}</span>`;
    }
    const p = st.b[s];
    if (st.steen.has(s)) h += '<svg class="st" viewBox="0 0 45 45"><use href="#sSteen"/></svg>';
    else if (p) h += stukSvg(p);
    if (st.ster.has(s)) h += '<svg class="ster" viewBox="0 0 45 45"><use href="#sSter"/></svg>';
    if (st.doel.has(s)) h += p || st.steen.has(s) ? '<i class="ring"></i>' : '<i class="punt"></i>';
    const lab = S.naam(s) + (p ? ', ' + (S.isW(p) ? 'witte ' : 'zwarte ') + NAAM[S.soort(p)] : '') + (st.ster.has(s) ? ', ster' : '');
    return `<button class="${cls.join(' ')}" data-sq="${s}" aria-label="${lab}">${h}</button>`;
  }
  function pijlSvg() {
    if (!st.pijlen.length) return '';
    const c = s => { let f = S.fileOf(s), r = S.rankOf(s); if (st.om) { f = 7 - f; r = 7 - r; } return [f + 0.5, 7 - r + 0.5]; };
    const lijnen = st.pijlen.map(([a, b]) => {
      const [x1, y1] = c(S.idx(a)), [x2, y2] = c(S.idx(b));
      const d = Math.hypot(x2 - x1, y2 - y1), k = (d - 0.32) / d;
      return `<line x1="${x1}" y1="${y1}" x2="${x1 + (x2 - x1) * k}" y2="${y1 + (y2 - y1) * k}" stroke="rgba(228,87,46,.85)" stroke-width=".17" stroke-linecap="round" marker-end="url(#pijlpunt)"/>`;
    }).join('');
    return `<svg class="pijlen" viewBox="0 0 8 8"><defs><marker id="pijlpunt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10z" fill="rgba(228,87,46,.95)"/></marker></defs>${lijnen}</svg>`;
  }
  const api = {
    el,
    zet(p) { st.b = (p.b || p).slice(); return api; },
    stukken() { return st.b; },
    laag(n, l) { if (!l || (Array.isArray(l) && !l.length)) delete st.lagen[n]; else st.lagen[n] = l instanceof Set ? l : set(l); return api; },
    doelen(l) { st.doel = set(l); return api; },
    sterren(l) { st.ster = set(l); return api; },
    stenen(l) { st.steen = set(l); return api; },
    pijlen(l) { st.pijlen = l || []; return api; },
    omdraaien(v) { st.om = v; return api; },
    kleurOm(v) { st.kleurOm = !!v; return api; },
    wis() { st.lagen = {}; st.pijlen = []; st.doel = new Set(); return api; },
    render() { el.innerHTML = volgorde().map(vak).join('') + pijlSvg(); return api; },
    tik(fn) { tik = fn; return api; },
    schud() { el.classList.remove('schud'); void el.offsetWidth; el.classList.add('schud'); Geluid.fout(); },
    animeer(van, naar) {
      const a = el.querySelector(`[data-sq="${van}"]`), b = el.querySelector(`[data-sq="${naar}"]`);
      const p = b && b.querySelector('svg.st');
      if (!a || !b || !p) return;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      p.style.transition = 'none';
      p.style.transform = `translate(${ra.left - rb.left}px,${ra.top - rb.top}px)`;
      void p.offsetWidth;
      p.style.transition = '';
      p.style.transform = '';
      Geluid.tik();
    },
  };
  el.addEventListener('click', e => { const v = e.target.closest('.vak'); if (v && tik) tik(+v.dataset.sq); });
  return api;
}

    if (stap === 'herhaal' && code3 !== eerste) return toonPrentjes(code, klas, l, 'kies', '', 'Dat was niet hetzelfde. Kies opnieuw.');
    try {
      const fn = stap === 'invoer' ? 'sk_laden' : 'sk_code_kiezen';
      const r = await rpc(fn, { p_code: code, p_leerling: l.id, p_pin: code3 });

        return toonPrentjes(code, klas, { ...l, heeft_code: r.fout !== 'geen_code' }, r.fout === 'geen_code' ? 'kies' : 'invoer', '', m);
      }
      profiel = { modus: 'klas', code, klasNaam: klas.naam, leerling: { id: l.id, naam: l.naam, symbool: l.symbool }, pin: code3 };
      LS.set('rs-profiel', profiel);
      data = samen(LS.get(dataSleutel(), null), r.gegevens);
      inst = r.instellingen || {}; LS.set(instSleutel(), inst);
      LS.set(dataSleutel(), data);
      zetSync('ok');
      ga(toonKaart);
    } catch (err) {
      toonPrentjes(code, klas, l, stap, eerste, 'Ik kan de school-server niet bereiken. Probeer het straks opnieuw.');
    }
  });
}

/* ---------- helpers voor posities ---------- */
const leegFEN = '8/8/8/8/8/8/8/8 w - - 0 1';

  const q = S.kopie(p); q.beurt = S.kleur(p.b[van]) || p.beurt;
  const m = S.zetten(q).find(z => z.van === van && z.naar === naar && (!z.promo || S.soort(z.promo) === (promo ? promo.toLowerCase() : 'q')));
  if (m) return S.doeZet(q, m);
  const r = S.kopie(p); r.b[naar] = r.b[van]; r.b[van] = null; return r;
}

/* ---------- uitleg ---------- */

        zegIn(b, 'robbie', t);
        Geluid.goed();
        ctx.paneel.querySelector('.knoppen').innerHTML = '<button id="v" class="knop-hoofd">Verder</button>';
        ctx.paneel.querySelector('#v').onclick = volgende;
        return;
      }
      if (!fout.length && !gemist.length) {
        af = true; Geluid.goed();
        bord.wis().laag('goed', juist).laag('merk', rd.merk).render();
        zegIn(b, 'robbie', ['Super!', 'Helemaal juist!', 'Knap gedaan!', 'Prima!'][r % 4]);
        ctx.paneel.querySelector('.knoppen').innerHTML = '<button id="v" class="knop-hoofd">Volgende</button>';
        ctx.paneel.querySelector('#v').onclick = volgende;
        return;
      }
      fouten++; Geluid.fout();
      if (pogingen >= 2 || enkel && pogingen >= 2) {
        af = true;
        bord.wis().laag('goed', juist).laag('fout', fout).laag('gemist', gemist).render();
        zegIn(b, 'robbie', 'Kijk, de omcirkelde vakjes zijn de juiste. Probeer het te onthouden!');
        ctx.paneel.querySelector('.knoppen').innerHTML = '<button id="v" class="knop-hoofd">Volgende</button>';
        ctx.paneel.querySelector('#v').onclick = volgende;
        return;
      }
      bord.wis().laag('kies', juist).laag('fout', fout).laag('merk', rd.merk).render();
      const delen = [];
      if (fout.length) delen.push(`${fout.length} ${fout.length === 1 ? 'vakje is' : 'vakjes zijn'} fout (rood)`);
      if (gemist.length) delen.push(`je mist er nog ${gemist.length}`);
      zegIn(b, 'robbie', `Bijna! ${delen.join(' en ')}. Probeer nog eens.`);
      fout.forEach(s => kies.delete(s));
      setTimeout(() => { if (!af) bord.wis().laag('kies', kies).laag('merk', rd.merk).render(); }, 1400);
      tel();
    }
  }
  function volgende() { r++; if (r < a.rondes.length) ronde(); else ctx.klaar(fouten === 0 ? 2 : 1); }
  ronde();
}

/* ---------- vakjesjager ---------- */
function doeJager(ctx) {
  const n = ctx.a.rondes; let r = 0, fouten = 0, t0 = 0, bezig = false;
  const lijst = schud([...Array(64).keys()]).slice(0, n);
  const bord = Bord(ctx.bordEl);
  bord.wis().zet(pos()).render();
  ctx.paneel.innerHTML = `<div id="b"></div><p class="vraag">Tik op het vakje:</p><div class="groot" id="doel"></div><p class="teller" id="tel"></p>`;
  zegIn(ctx.paneel.querySelector('#b'), 'bobbie', 'Ik roep een vakje, jij tikt het zo snel als je kan! Weet je nog? Eerst de letter, dan het cijfer.');
  function ronde() {
    ctx.voortgang(r, n);
    ctx.paneel.querySelector('#doel').textContent = S.naam(lijst[r]);
    ctx.paneel.querySelector('#tel').textContent = `Vakje ${r + 1} van ${n}${fouten ? ` · ${fouten} fout` : ''}`;
    bezig = false;
    if (r > 0 || t0) Stem.spreek(S.naam(lijst[r]));
  }
  bord.tik(s => {
    if (bezig) return;
    if (!t0) t0 = Date.now();
    bezig = true;
    const d = lijst[r];
    if (s === d) { Geluid.goed(); bord.wis().laag('goed', [s]).render(); }
    else { fouten++; Geluid.fout(); bord.wis().laag('fout', [s]).laag('goed', [d]).render(); zegIn(ctx.paneel.querySelector('#b'), 'bobbie', `Oei, dat was ${S.naam(s)}. ${S.naam(d)} ligt hier, op de ${S.FILES[S.fileOf(d)]}-lijn en rij ${S.rankOf(d) + 1}.`, false); }
    setTimeout(() => {
      bord.wis().render(); r++;
      if (r < n) ronde();
      else { ctx_tijd = Math.round((Date.now() - t0) / 1000); ctx.klaar(fouten === 0 ? 2 : 1); }
    }, s === d ? 350 : 1400);
  });
  t0 = 0;
  ronde();
}

/* ---------- hoe heet dit vakje ---------- */
function doeNaam(ctx) {
  const n = ctx.a.rondes; let r = 0, fouten = 0;
  const lijst = schud([...Array(64).keys()]).slice(0, n);
  const bord = Bord(ctx.bordEl);
  function ronde() {
    ctx.voortgang(r, n);
    const d = lijst[r], f = S.fileOf(d), k = S.rankOf(d);
    const kand = new Set([S.naam(d)]);
    const extra = schud([[f, k + 1], [f, k - 1], [f + 1, k], [f - 1, k], [k, f], [7 - f, k], [f + 2, k + 1]].filter(([x, y]) => x >= 0 && x < 8 && y >= 0 && y < 8).map(([x, y]) => S.naam(y * 8 + x)));
    for (const e of extra) { if (kand.size >= 4) break; kand.add(e); }
    const opties = schud([...kand]);
    bord.wis().zet(pos()).laag('merk', [d]).laag('licht', [d]).render();
    ctx.paneel.innerHTML = `<p class="vraag">Hoe heet het oranje vakje?</p><div class="opties" style="grid-template-columns:repeat(2,1fr)">${opties.map(o => `<button data-o="${o}" style="text-align:center;font-size:26px">${o}</button>`).join('')}</div><div id="b"></div><p class="teller">Vakje ${r + 1} van ${n}</p>`;
    if (r === 0) Stem.spreek('Hoe heet het oranje vakje?');
    ctx.paneel.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      if (b.dataset.o === S.naam(d)) {
        Geluid.goed(); b.classList.add('goed');
        setTimeout(() => { r++; r < n ? ronde() : ctx.klaar(fouten === 0 ? 2 : 1); }, 500);
      } else {
        fouten++; Geluid.fout(); b.classList.add('mis'); b.disabled = true;
        zegIn(ctx.paneel.querySelector('#b'), 'robbie', `Kijk eerst naar de letter onderaan, dan naar het cijfer links.`);
      }
    });
  }
  ronde();
}

/* ---------- keuzevragen ---------- */

/* ---------- sterrenjacht ---------- */
function doeSterren(ctx) {
  const a = ctx.a; let li = 0, allesPerfect = true;
  const bord = Bord(ctx.bordEl);
  function level() {
    const L = a.levels[li];
    ctx.voortgang(li, a.levels.length);
    const min = RG.minZetten(L), lijst = RG.doelLijst(L), gevaar = RG.gevaarVakken(L);
    let s = S.idx(L.op), g = 0, zetten = 0, toonGevaar = false, hulp = false, af = false;
    const stuk = L.stuk.toUpperCase();
    const heeftZwart = Object.keys(L.zwart || {}).length > 0, heeftSter = (L.sterren || []).length > 0;
    const doelTekst = L.tekst || a.tekst || (heeftZwart && heeftSter ? `Pak alle sterren en sla alle zwarte stukken met je ${NAAM[stuk.toLowerCase()]}.` : heeftZwart ? `Sla alle zwarte stukken met je ${NAAM[stuk.toLowerCase()]}.` : `Pak alle sterren met je ${NAAM[stuk.toLowerCase()]}.`);
    function teken(van) {
      const b = RG.sterrenBord(L, g); b[s] = stuk;
      const sterren = (L.sterren || []).filter((v, i) => !(g & (1 << (Object.keys(L.zwart || {}).length + i))));
      bord.wis().zet(b).sterren(sterren).stenen(L.stenen).laag('gekozen', [s]);
      if (toonGevaar) bord.laag('gevaar', gevaar);
      if (hulp) bord.doelen(RG.sterZetten(L, s, g));
      bord.render();
      if (van !== undefined) bord.animeer(van, s);
    }
    function paneel(boodschap, wie = 'robbie') {
      ctx.paneel.innerHTML = `<p class="vraag">${esc(doelTekst)}</p><div id="b"></div>
        <p class="teller">Zetten: <b>${zetten}</b> · Kortste weg: <b>${min}</b> ${zetten > min ? '· de gouden ster is weg, maar je kan nog winnen' : ''}</p>
        ${knoppen(`<button id="opnieuw">Opnieuw</button><button id="hulp">${hulp ? 'Verberg' : 'Toon'} waar ik heen kan</button>${L.gevaar ? `<button id="gev">${toonGevaar ? 'Verberg' : 'Toon'} verboden vakjes</button>` : ''}`)}`;
      if (boodschap) zegIn(ctx.paneel.querySelector('#b'), wie, boodschap);
      ctx.paneel.querySelector('#opnieuw').onclick = () => level();
      ctx.paneel.querySelector('#hulp').onclick = () => { hulp = !hulp; teken(); paneel(); };
      const gv = ctx.paneel.querySelector('#gev'); if (gv) gv.onclick = () => { toonGevaar = !toonGevaar; teken(); paneel(); };
    }
    teken();
    paneel(li === 0 ? `${doelTekst} Lukt het in ${min} ${min === 1 ? 'zet' : 'zetten'}? Dan krijg je de gouden ster!` : `Level ${li + 1}! Kortste weg: ${min} ${min === 1 ? 'zet' : 'zetten'}.`);
    if (li === 0) Stem.spreek(`${doelTekst} Lukt het in ${min} zetten?`);
    bord.tik(t => {
      if (af || t === s) return;
      const mog = RG.sterZetten(L, s, g);
      if (!mog.includes(t)) {
        bord.schud();
        let m;
        if ((L.stenen || []).includes(S.naam(t))) m = 'Daar ligt een steen. Daar kan je niet op.';
        else if (gevaar.has(t)) {
          const aanv = Object.entries(L.wachters || {}).find(([v, x]) => { const p = { b: RG.sterrenBord(L, 0), beurt: 'b', rok: '', ep: -1 }; (L.stenen || []).forEach(z => p.b[S.idx(z)] = 'X'); return S.raakt(p, S.idx(v), t); });
          m = `Gevaarlijk! ${aanv ? `De zwarte ${NAAM[aanv[1]]} op ${aanv[0]}` : 'Een zwart stuk'} bewaakt dat vakje. Daar kan je ${NAAM[stuk.toLowerCase()]} geslagen worden.`;
          if (aanv) bord.pijlen([[aanv[0], S.naam(t)]]).render();
          setTimeout(() => teken(), 1600);
        }
        else if (Object.keys(L.wachters || {}).includes(S.naam(t))) m = 'Die wachter mag je niet slaan.';
        else m = stuk === 'P' ? 'Zo kan een pion niet. Recht vooruit, of schuin vooruit om te slaan.' : `Zo kan ${stuk === 'K' ? 'de koning' : stuk === 'N' ? 'het paard' : 'de ' + NAAM[stuk.toLowerCase()]} niet bewegen${'RBQ'.includes(stuk) ? ', of er staat iets in de weg' : ''}.`;
        paneel(m);
        if (!hulp && !gevaar.has(t)) { bord.doelen(mog).render(); setTimeout(() => { if (!hulp) teken(); }, 1500); }
        return;
      }
      const van = s; s = t; zetten++; g = RG.verzamel(L, t, g);
      teken(van);
      const alles = (1 << lijst.length) - 1;
      if (g === alles) {
        af = true;
        const perfect = zetten <= min;
        if (!perfect) allesPerfect = false;
        Geluid.goed();
        const m = perfect ? `Gelukt in ${zetten} ${zetten === 1 ? 'zet' : 'zetten'}! Dat is de kortste weg.` : `Gelukt in ${zetten} zetten! Het kan ook in ${min}. Probeer je het nog eens voor de gouden ster?`;
        paneel(m);
        const k = ctx.paneel.querySelector('.knoppen');
        k.innerHTML = `${perfect ? '' : '<button id="nog">Nog eens</button>'}<button id="verder" class="knop-hoofd">${li < a.levels.length - 1 ? 'Volgend level' : 'Klaar'}</button>`;
        const nog = k.querySelector('#nog'); if (nog) nog.onclick = () => { allesPerfect = true; level(); };
        k.querySelector('#verder').onclick = () => { li++; li < a.levels.length ? level() : ctx.klaar(allesPerfect ? 2 : 1); };
        return;
      }
      if (!RG.haalbaar(L, s, g)) { paneel('Oei! Nu kan je niet meer alles pakken. Tik op Opnieuw.'); af = true; return; }
      paneel();
    });
  }
  level();
}

/* ---------- zetopdrachten ---------- */
function vraagPromo(kleur) {
  return new Promise(res => {
    venster(`<h2>Je pion promoveert!</h2><p>Kies wat hij wordt:</p><div class="promo">${'QRBN'.split('').map(p => `<button data-p="${p}" aria-label="${NAAM[p.toLowerCase()]}">${stukSvg(kleur === 'w' ? p : p.toLowerCase())}</button>`).join('')}</div>`, v => {
      v.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { sluit(); res(b.dataset.p.toLowerCase()); });
    });
  });
}
/* Gemeenschappelijke selectie: tik een eigen stuk, dan een doelvak. onZet(m) krijgt de echte zet. */
function zetInvoer(bord, getPos, opt) {
  let gekozen = -1;
  const teken = () => { opt.teken(); if (gekozen >= 0) { bord.laag('gekozen', [gekozen]).doelen(S.zetten(getPos(), gekozen).map(m => m.naar)).render(); } };
  bord.tik(async s => {
    const p = getPos();
    if (!opt.actief()) return;
    const x = p.b[s];
    if (gekozen < 0 || (x && S.kleur(x) === p.beurt && s !== gekozen)) {
      if (x && S.kleur(x) === p.beurt) {
        if (opt.alleenStuk && S.naam(s) !== opt.alleenStuk) { opt.melding(`Gebruik het stuk op ${opt.alleenStuk}.`); bord.schud(); return; }
        gekozen = s; Geluid.tik(); teken();
      } else if (x) { opt.melding('Dat is een stuk van de tegenstander. Tik op een van jouw stukken.'); }
      return;
    }
    if (s === gekozen) { gekozen = -1; teken(); return; }
    const lijst = S.zetten(p).filter(m => m.van === gekozen && m.naar === s);
    if (!lijst.length) {
      const pseudo = S.pseudoZetten(p).some(m => m.van === gekozen && m.naar === s);
      const so = S.soort(p.b[gekozen]);
      let m;
      if (pseudo) m = so === 'k' ? `Daar kan je koning geslagen worden. Een koning mag nooit op een aangevallen vakje.` : S.schaak(p) ? 'Je staat schaak! Je moet eerst iets doen tegen het schaak.' : 'Dan staat je eigen koning schaak. Dat mag niet!';
      else if (so === 'k' && Math.abs(s - gekozen) === 2) m = 'Rokeren mag hier niet. Denk aan de regels: niet schaak staan, niet over een aangevallen vakje, en niets ertussen.';
      else m = `Zo kan je ${NAAM[so]} niet bewegen.`;
      bord.schud(); opt.melding(m);
      return;
    }
    let m = lijst[0];
    if (lijst.length > 1) {
      const keus = opt.autoDame ? 'q' : await vraagPromo(p.beurt);
      m = lijst.find(z => S.soort(z.promo) === keus) || lijst[0];
    }
    const van = gekozen; gekozen = -1;
    opt.onZet(m, van);
  });
  return { reset() { gekozen = -1; } };
}

function doeZet(ctx) {
  const a = ctx.a; let o = 0, fouten = 0, tip = false;
  const bord = Bord(ctx.bordEl);
  let tok = 0;
  function opgave() {
    const opg = a.opgaven[o], id = ++tok;
    ctx.voortgang(o, a.opgaven.length);
    let p = pos(opg.fen), actief = false, doel = { ...opg }, laatst = null;
    const teken = () => { bord.wis().zet(p); if (laatst) bord.laag('laatst', laatst); if (S.schaak(p)) bord.laag('schaak', [S.koningVan(p, p.beurt)]); bord.render(); };
    const melding = (t, wie = 'robbie', spreek = true) => zegIn(ctx.paneel.querySelector('#b'), wie, t, spreek);
    ctx.paneel.innerHTML = `<p class="vraag" id="vr">${esc(opg.vraag)}</p><div id="b"></div>${knoppen('<button id="tip">Tip</button><button id="opn">Opnieuw</button>')}`;
    Stem.spreek(opg.vraag);
    teken();
    const bindKnoppen = () => {
      const tb = ctx.paneel.querySelector('#tip');
      if (tb) tb.onclick = () => {
        const opl = RG.oplossingen(p, doel);
        if (!opl.length) return;
        tip = true;
        bord.laag('merk', [...new Set(opl.map(m => m.van))]).render();
        melding(`Tip: kijk eens naar het stuk met het oranje kader.`);
      };
      const ob = ctx.paneel.querySelector('#opn'); if (ob) ob.onclick = () => opgave();
    };
    bindKnoppen();
    const begin = () => { actief = true; teken(); };
    if (opg.voorZet) {
      melding('Kijk goed wat zwart doet...', 'robbie', false);
      setTimeout(() => {
        if (id !== tok) return;
        const van = S.idx(opg.voorZet[0]), naar = S.idx(opg.voorZet[1]);
        const m = S.vindZet(p, van, naar);
        p = S.doeZet(p, m); laatst = [van, naar];
        teken(); bord.animeer(van, naar);
        melding(opg.vraag);
        begin();
      }, 900);
    } else begin();
    zetInvoer(bord, () => p, {
      actief: () => actief, alleenStuk: opg.stuk, teken,
      melding: t => melding(t),
      onZet: (m, van) => {
        const res = RG.controleer(p, m, doel);
        const q = S.doeZet(p, m);
        bord.wis().zet(q).laag('laatst', [van, m.naar]).render().animeer(van, m.naar);
        if (res.ok && res.verder) {
          actief = false;
          melding('Sterke zet! Nu is zwart aan zet...');
          setTimeout(() => {
            if (id !== tok) return;
            const antw = S.zetten(q);
            let best = antw[0], minM = 99;
            for (const z of antw) { const r = S.doeZet(q, z); const n = S.matIn(r, 1).length; if (n < minM) { minM = n; best = z; } }
            p = S.doeZet(q, best); laatst = [best.van, best.naar];
            teken(); bord.animeer(best.van, best.naar);
            doel = { doel: 'mat' };
            ctx.paneel.querySelector('#vr').textContent = 'Geef nu mat!';
            melding('Zwart heeft gezet. Geef nu mat!');
            actief = true;
          }, 1000);
          return;
        }
        if (res.ok) {
          actief = false; Geluid.goed();
          if (S.schaak(q) && S.isMat(q)) bord.laag('schaak', [S.koningVan(q, q.beurt)]).render();
          melding(opg.uitleg || 'Goed gedaan!');
          const k = ctx.paneel.querySelector('.knoppen');
          k.innerHTML = `<button id="volg" class="knop-hoofd">${o < a.opgaven.length - 1 ? 'Volgende' : 'Klaar'}</button>`;
          k.querySelector('#volg').onclick = () => { o++; o < a.opgaven.length ? opgave() : ctx.klaar(fouten === 0 && !tip ? 2 : 1); };
          return;
        }
        fouten++; Geluid.fout(); actief = false;
        melding(res.tekst);
        setTimeout(() => { if (id !== tok) return; actief = true; teken(); }, 1700);
      },
    });
  }
  opgave();
}

/* ---------- minispel ---------- */
function doeMinispel(ctx) {
  const a = ctx.a; let behaald = 0;
  const bord = Bord(ctx.bordEl);
  function kiesNiveau() {
    ctx.voortgang(0, 1);
    bord.wis().zet(pos(a.fen)).render();
    ctx.paneel.innerHTML = `<div id="b"></div>${knoppen('<button id="n1" class="knop-hoofd">Speel tegen Bobbie</button><button id="n2" class="knop-blauw">Uitdaging: slimme Bobbie</button>')}`;
    zegIn(ctx.paneel.querySelector('#b'), 'robbie', a.uitleg);
    ctx.paneel.querySelector('#n1').onclick = () => spel(1);
    ctx.paneel.querySelector('#n2').onclick = () => spel(2);
  }
  let spelId = 0;
  function spel(niveau) {
    const id = ++spelId;
    let p = pos(a.fen), zetNr = 0, actief = true, laatst = null;
    const geslagen = { w: 0, b: 0 }, regels = a.regels;
    const teken = () => { bord.wis().zet(p); if (laatst) bord.laag('laatst', laatst); bord.render(); };
    const status = (t, wie = 'bobbie', spreek = false) => zegIn(ctx.paneel.querySelector('#b'), wie, t, spreek);
    ctx.paneel.innerHTML = `<p class="vraag">Jij bent wit. ${niveau === 2 ? 'Tegen slimme Bobbie!' : 'Tegen Bobbie.'}</p><div id="b"></div><p class="teller" id="tel"></p>${knoppen('<button id="opn">Opnieuw beginnen</button><button id="regels">Spelregels</button>')}`;
    const tel = () => {
      const d = [];
      if (regels.maxZetten) d.push(`Zet ${zetNr} van ${regels.maxZetten}`);
      if (regels.punten) d.push(`Jouw punten: ${geslagen.w} · Bobbie: ${geslagen.b}`);
      ctx.paneel.querySelector('#tel').textContent = d.join(' · ');
    };
    ctx.paneel.querySelector('#opn').onclick = () => spel(niveau);
    ctx.paneel.querySelector('#regels').onclick = () => status(a.uitleg, 'robbie', true);
    status(niveau === 2 ? 'Ik heb goed geoefend. Pas maar op!' : 'Jij mag beginnen!', 'bobbie', true);
    teken(); tel();
    const einde = u => {
      actief = false;
      const reden = { promotie: u.winnaar === 'w' ? 'Je pion haalde de overkant!' : 'Mijn pion haalde de overkant!', alles: u.winnaar === 'w' ? 'Je sloeg al mijn stukken!' : 'Ik sloeg al jouw stukken!', vast: u.winnaar === 'w' ? 'Ik kan geen zet meer doen!' : 'Jij kan geen zet meer doen.', punten: `Jij hebt ${geslagen.w} punten, ik heb er ${geslagen.b}.`, zetten: 'De zetten zijn op.', mat: 'Schaakmat!' }[u.reden] || '';
      const k = ctx.paneel.querySelector('.knoppen');
      if (u.winnaar === 'w') {
        Geluid.feest(); confetti();
        behaald = Math.max(behaald, niveau);
        status(`${reden} Jij wint! ${niveau === 1 ? 'Durf je de uitdaging tegen slimme Bobbie aan? Dan verdien je de gouden ster.' : 'Wauw, je versloeg slimme Bobbie!'}`, 'bobbie', true);
        k.innerHTML = niveau === 1 ? '<button id="klaar">Klaar</button><button id="uit" class="knop-blauw">Ja, uitdaging!</button>' : '<button id="klaar" class="knop-hoofd">Klaar</button>';
        const ub = k.querySelector('#uit'); if (ub) ub.onclick = () => spel(2);
        k.querySelector('#klaar').onclick = () => ctx.klaar(behaald >= 2 ? 2 : 1);
      } else {
        Geluid.fout();
        status(`${reden} ${u.winnaar === 'b' ? 'Hihi, ik win deze keer!' : 'Gelijkspel!'} Nog eens?`, 'bobbie', true);
        k.innerHTML = `<button id="nog" class="knop-hoofd">Nog eens</button>${behaald ? '<button id="klaar">Klaar</button>' : ''}`;
        k.querySelector('#nog').onclick = () => spel(niveau);
        const kb = k.querySelector('#klaar'); if (kb) kb.onclick = () => ctx.klaar(behaald >= 2 ? 2 : 1);
      }
    };
    zetInvoer(bord, () => p, {
      actief: () => actief && p.beurt === 'w', teken, autoDame: true,
      melding: t => status(t, 'robbie', true),
      onZet: (m, van) => {
        if (m.slag) geslagen.w += S.WAARDE[S.soort(m.slag)];
        p = S.doeZet(p, m); zetNr++; laatst = [van, m.naar];
        teken(); bord.animeer(van, m.naar); tel();
        const u = S.variantUitslag(p, regels, m, zetNr, geslagen);
        if (u) return einde(u);
        actief = false;
        status('Even denken...');
        setTimeout(() => {
          if (id !== spelId) return;
          const bm = S.besteZet(p, niveau, regels);
          if (!bm) return einde({ winnaar: 'w', reden: 'vast' });
          if (bm.slag) geslagen.b += S.WAARDE[S.soort(bm.slag)];
          p = S.doeZet(p, bm); laatst = [bm.van, bm.naar];
          teken(); bord.animeer(bm.van, bm.naar); tel();
          const u2 = S.variantUitslag(p, regels, bm, zetNr, geslagen);
          if (u2) return einde(u2);
          actief = true;
          status(bm.slag ? `Hap! Ik sloeg je ${NAAM[S.soort(bm.slag)]}. Jouw beurt.` : 'Jouw beurt!');
        }, 450 + Math.random() * 400);
      },
    });
  }
  kiesNiveau();
}

/* ---------- opstellen ---------- */
function doeOpstellen(ctx) {
  const doel = S.leesFEN(S.START);
  const b = doel.b.map((x, i) => (i >= 48 ? x : null));
  const voorraad = { K: 1, Q: 1, R: 2, B: 2, N: 2, P: 8 };
  let kies = null, fouten = 0, eerste = true, af = false;
  const bord = Bord(ctx.bordEl);
  ctx.voortgang(0, 1);
  function teken(fout = []) { bord.wis().zet(b).laag('fout', fout).render(); }
  function lade() {
    const over = Object.values(voorraad).reduce((t, v) => t + v, 0);
    ctx.paneel.innerHTML = `<p class="vraag">${esc(ctx.a.tekst)}</p><div id="b"></div>
      <div class="lade">${Object.entries(voorraad).map(([p, n]) => `<button data-p="${p}" class="${kies === p ? 'aan' : ''}" ${n ? '' : 'disabled'} aria-label="${NAAM[p.toLowerCase()]}, nog ${n}">${stukSvg(p)}<span>${n}</span></button>`).join('')}</div>
      <p class="teller">${over ? `Nog ${over} stukken te plaatsen. Kies een stuk en tik dan een vakje.` : 'Alle stukken staan op het bord!'}</p>
      ${knoppen(`<button id="ctrl" class="knop-hoofd" ${over ? 'disabled' : ''}>Controleer</button>`)}`;
    ctx.paneel.querySelectorAll('[data-p]').forEach(x => x.onclick = () => { kies = x.dataset.p; Geluid.tik(); lade(); });
    ctx.paneel.querySelector('#ctrl').onclick = controle;
  }
  function controle() {
    const fout = [];
    for (let i = 0; i < 16; i++) if (b[i] !== doel.b[i]) fout.push(i);
    if (!fout.length) {
      af = true; Geluid.goed(); teken();
      zegIn(ctx.paneel.querySelector('#b'), 'robbie', 'Perfect! Het bord staat klaar. Nu kan de partij beginnen!');
      const k = ctx.paneel.querySelector('.knoppen'); k.innerHTML = '<button id="k" class="knop-hoofd">Klaar</button>';
      k.querySelector('#k').onclick = () => ctx.klaar(eerste ? 2 : 1);
      return;
    }
    eerste = false; fouten++; Geluid.fout(); teken(fout);
    zegIn(ctx.paneel.querySelector('#b'), 'robbie', `${fout.length} vakjes kloppen nog niet (rood). Tik een stuk aan om het terug te nemen. Tip: torens in de hoek, dan paarden, dan lopers. De dame op haar eigen kleur!`);
  }
  bord.tik(s => {
    if (af) return;
    if (b[s] && S.isW(b[s])) { voorraad[b[s]]++; b[s] = null; Geluid.tik(); teken(); lade(); return; }
    if (b[s]) return;
    if (!kies || !voorraad[kies]) { zegIn(ctx.paneel.querySelector('#b'), 'robbie', 'Kies eerst een stuk onder het bord.'); return; }
    if (kies === 'P' && (s < 8 || s > 55)) { bord.schud(); zegIn(ctx.paneel.querySelector('#b'), 'robbie', 'Een pion kan nooit op de eerste of laatste rij staan.'); return; }
    b[s] = kies; voorraad[kies]--; if (!voorraad[kies]) kies = null; Geluid.tik();
    teken(); lade();
  });
  teken(); lade();
  zegIn(ctx.paneel.querySelector('#b'), 'robbie', 'Zet de witte stukken klaar. Ik kijk mee!');
}

    el.innerHTML = `${bubbel('robbie', tekst)}<div class="puzzelrooster" style="margin-top:14px">${lijst.map((f, i) => `<button data-i="${i}" class="${data.puzzels[tab + '-' + i] ? 'klaar' : ''}">${i + 1}</button>`).join('')}</div>`;
    Stem.spreek(tekst);
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => ga(speelPuzzel, { id: tab + '-' + b.dataset.i, fen: lijst[+b.dataset.i], doel: tab === 'm1' ? 'mat' : 'mat2', titel: `${tab === 'm1' ? 'Mat in 1' : 'Mat in 2'}: puzzel ${+b.dataset.i + 1}`, terugTab: tab }));
  } else if (tab === 'dag') {
    const pool = I.matIn1.map(f => [f, 'mat']).concat(I.matIn2.map(f => [f, 'mat2']));
    const dag = Math.floor(Date.now() / 864e5);

    el.querySelector('#go').onclick = () => ga(speelPuzzel, { id, fen: f, doel: d, titel: 'Puzzel van de dag', terugTab: 'dag' });
  } else if (tab === 'maak') puzzelMaker(el);
  else {
    el.innerHTML = data.mijn.length ? `${bubbel('robbie', 'Dit zijn jouw eigen puzzels. Laat iemand anders ze proberen!')}<div class="pad">${data.mijn.map((p, i) => `<div class="stap"><span class="bol">${i + 1}</span><span><h3>Puzzel ${i + 1}</h3><small>Gemaakt op ${new Date(p.t).toLocaleDateString('nl-BE')}${p.aantal > 1 ? ` · ${p.aantal} manieren om mat te geven` : ''}</small></span><span class="knoppen"><button class="knop-klein" data-s="${i}">Spelen</button><button class="knop-klein" data-d="${i}">Wissen</button></span></div>`).join('')}</div>` : bubbel('robbie', 'Je hebt nog geen eigen puzzels. Maak er een in de Puzzelmaker!');
    el.querySelectorAll('[data-s]').forEach(b => b.onclick = () => ga(speelPuzzel, { id: null, fen: data.mijn[+b.dataset.s].fen, doel: 'mat', titel: `Mijn puzzel ${+b.dataset.s + 1}`, terugTab: 'mijn' }));
    el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => venster(`<h2>Puzzel wissen?</h2><p>Weet je het zeker?</p><div class="knoppen" style="justify-content:center"><button id="nee">Nee</button><button id="ja" class="knop-hoofd">Ja, wissen</button></div>`, v => {
      v.querySelector('#nee').onclick = sluit;
      v.querySelector('#ja').onclick = () => { data.mijn.splice(+b.dataset.d, 1); bewaar(); sluit(); ga(toonPuzzelkamer, 'mijn'); };

function speelPuzzel(pz) {
  const terug = () => ga(toonPuzzelkamer, pz.terugTab);
  app.innerHTML = kop(terug, 'Puzzelkamer') + `<main><div class="akop"><h2>${esc(pz.titel)}</h2></div>
    <div class="speelveld"><div id="bordplek"></div><div class="zijpaneel" id="paneel"></div></div></main>`;
  bindKop(terug);
  const a = { type: 'zet', opgaven: [{ fen: pz.fen, doel: pz.doel, vraag: pz.doel === 'mat' ? 'Wit is aan zet. Geef mat in 1 zet!' : 'Wit is aan zet. Geef mat in 2 zetten!', uitleg: 'Schaakmat! Puzzel opgelost.' }] };
  const ctx = maakCtx(a, document.getElementById('bordplek'), document.getElementById('paneel'), null, s => {
    const eerste = pz.id && !data.puzzels[pz.id];
    if (pz.id) { data.puzzels[pz.id] = Math.max(data.puzzels[pz.id] || 0, s); if (eerste) logOefening(); bewaar(); }
    Geluid.feest(); confetti();
    const tekst = s >= 2 ? 'Opgelost zonder fout! Echt sterk.' : 'Opgelost! Knap volgehouden.';
    venster(`<h2>Puzzel opgelost!</h2><div class="grote-sterren">${ico('sSter')}${ico('sSter', 'ikoon' + (s >= 2 ? '' : ' leeg'))}</div>${bubbel('robbie', tekst)}
      <div class="knoppen" style="justify-content:center;margin-top:14px"><button id="t">Terug naar de puzzels</button>${nextPuzzel(pz) ? '<button id="n" class="knop-hoofd">Volgende puzzel</button>' : ''}</div>`, v => {
      Stem.spreek(tekst);
      v.querySelector('#t').onclick = () => { sluit(); terug(); };
      const n = v.querySelector('#n'); if (n) n.onclick = () => { sluit(); ga(speelPuzzel, nextPuzzel(pz)); };

  start(ctx);
}
function nextPuzzel(pz) {
  if (!pz.id || !/^m[12]-/.test(pz.id)) return null;
  const [t, i] = pz.id.split('-'), lijst = t === 'm1' ? I.matIn1 : I.matIn2, n = +i + 1;
  if (n >= lijst.length) return null;
  return { id: t + '-' + n, fen: lijst[n], doel: pz.doel, titel: `${t === 'm1' ? 'Mat in 1' : 'Mat in 2'}: puzzel ${n + 1}`, terugTab: t };
}
function puzzelMaker(el) {
  el.innerHTML = `<div class="speelveld"><div id="bordplek"></div><div class="zijpaneel" id="pp"></div></div>`;
  const b = new Array(64).fill(null);
  let kies = 'K', modus = 'opstellen';
  const bord = Bord(el.querySelector('#bordplek'));
  const pp = el.querySelector('#pp');
  const teken = () => bord.wis().zet(b).render();
  function paneel(boodschap) {
    if (modus === 'opstellen') {
      pp.innerHTML = `<div id="b"></div><p><b>Wit</b></p><div class="lade">${'KQRBNP'.split('').map(p => `<button data-p="${p}" class="${kies === p ? 'aan' : ''}" aria-label="witte ${NAAM[p.toLowerCase()]}">${stukSvg(p)}</button>`).join('')}</div>
        <p><b>Zwart</b></p><div class="lade">${'kqrbnp'.split('').map(p => `<button data-p="${p}" class="${kies === p ? 'aan' : ''}" aria-label="zwarte ${NAAM[p]}">${stukSvg(p)}</button>`).join('')}<button data-p="gum" class="${kies === 'gum' ? 'aan' : ''}" aria-label="gom" style="font:700 14px Fredoka,sans-serif">Gom</button></div>
        ${knoppen('<button id="leeg">Leeg bord</button><button id="klaar" class="knop-hoofd">Klaar: speel je matzet</button>')}`;
      zegIn(pp.querySelector('#b'), 'robbie', boodschap || 'Maak je eigen matpuzzel! Zet stukken op het bord: minstens een witte en een zwarte koning. Daarna speel je zelf de matzet met wit.');
      pp.querySelectorAll('[data-p]').forEach(x => x.onclick = () => { kies = x.dataset.p; paneel(boodschap); });
      pp.querySelector('#leeg').onclick = () => { b.fill(null); teken(); };
      pp.querySelector('#klaar').onclick = probeer;
    } else {
      pp.innerHTML = `<div id="b"></div>${knoppen('<button id="terugop">Terug naar opstellen</button>')}`;
      zegIn(pp.querySelector('#b'), 'robbie', boodschap || 'Speel nu de zet waarmee wit mat geeft.');
      pp.querySelector('#terugop').onclick = () => { modus = 'opstellen'; bord.tik(plaats); teken(); paneel(); };
    }
  }
  function probeer() {
    const p = { b: b.slice(), beurt: 'w', rok: '', ep: -1, half: 0, vol: 1 };
    const tel = c => b.filter(x => x === c).length;
    let fout = '';
    if (tel('K') !== 1 || tel('k') !== 1) fout = 'Er moet precies één witte en één zwarte koning op het bord staan.';
    else if (b.some((x, i) => x && S.soort(x) === 'p' && (i < 8 || i > 55))) fout = 'Een pion kan niet op de eerste of laatste rij staan.';
    else if (S.schaak(p, 'b')) fout = 'De zwarte koning staat al schaak terwijl wit aan zet is. Dat kan niet in een echte partij.';
    else if (S.isMat(p) || !S.zetten(p).length) fout = 'Wit kan geen zet doen. Pas je puzzel aan.';
    else if (!S.matIn(p, 1).length) fout = 'Hmm, in deze stelling kan wit nog geen mat geven in 1 zet. Pas je puzzel aan.';
    if (fout) { Geluid.fout(); return paneel(fout); }
    modus = 'oplossen'; paneel();
    let q = p;
    zetInvoer(bord, () => q, {
      actief: () => modus === 'oplossen', teken: () => bord.wis().zet(q).render(),
      melding: t => paneel(t),
      onZet: (m, van) => {
        const r = S.doeZet(q, m);
        bord.wis().zet(r).render().animeer(van, m.naar);
        if (S.isMat(r)) {
          const aantal = S.matIn(p, 1).length;
          data.mijn.push({ fen: S.schrijfFEN(p), t: Date.now(), aantal });
          logOefening(); bewaar(); Geluid.feest(); confetti();
          const t = `Puzzel bewaard! ${aantal > 1 ? `Wist je dat er ${aantal} manieren zijn om hier mat te geven? Een echte puzzelmaker zorgt dat er maar één is. Lukt dat?` : 'Er is maar één matzet. Een echte puzzel!'}`;
          paneel(t);
          pp.querySelector('.knoppen').innerHTML = '<button id="nieuw">Nog een puzzel maken</button><button id="mijn" class="knop-hoofd">Naar mijn puzzels</button>';
          pp.querySelector('#nieuw').onclick = () => { modus = 'opstellen'; bord.tik(plaats); teken(); paneel(); };
          pp.querySelector('#mijn').onclick = () => ga(toonPuzzelkamer, 'mijn');
          modus = 'klaar';
        } else {
          Geluid.fout();
          paneel(S.isPat(r) ? 'Dat is pat, geen mat. Probeer een andere zet.' : 'Dat is nog geen mat. Probeer een andere zet.');
          setTimeout(() => { if (modus === 'oplossen') bord.wis().zet(q).render(); }, 1300);
        }
      },
    });
  }
  function plaats(s) {
    if (modus !== 'opstellen') return;
    if (kies === 'gum') b[s] = null;
    else if (b[s] === kies) b[s] = null;
    else {
      if ('Pp'.includes(kies) && (s < 8 || s > 55)) { bord.schud(); paneel('Een pion kan niet op de eerste of laatste rij staan.'); return; }
      if ('Kk'.includes(kies)) { const oud = b.indexOf(kies); if (oud >= 0) b[oud] = null; }
      b[s] = kies;
    }
    Geluid.tik(); teken();
  }
  bord.tik(plaats);
  teken(); paneel();
}

    const d = vandaag();
    data.partijen[d] = (data.partijen[d] || 0) + 1;
    data.lopend = { zetten: [], tegen, kleur, terug: 0, tips: 0, start: Date.now() };
    bewaar();
    ga(speelPartij);
  };
}
function speelPartij() {
  const L = data.lopend; if (!L) return ga(toonSpeelzaal);
  const T = TEGEN.find(x => x.id === L.tegen);
  const terug = () => ga(toonSpeelzaal);
  app.innerHTML = kop(terug, 'Speelzaal') + `<main><div class="akop"><h2>Jij tegen ${esc(T.naam)}</h2></div>
    <div class="speelveld"><div id="bordplek"></div><div class="zijpaneel" id="paneel"></div></div></main>`;
  bindKop(terug);
  const bord = Bord(document.getElementById('bordplek'), { omgedraaid: L.kleur === 'b' });
  const paneel = document.getElementById('paneel');
  let p, hist, notaties, laatst = null, actief = false, tipZet = null;
  function herbouw() {
    p = S.leesFEN(S.START); hist = []; notaties = []; laatst = null;
    for (const z of L.zetten) {
      const m = S.vindZet(p, S.idx(z.slice(0, 2)), S.idx(z.slice(2, 4)), z[4]);
      if (!m) break;
      notaties.push(S.notatie(p, m)); hist.push(S.sleutel(p));
      p = S.doeZet(p, m); laatst = [m.van, m.naar];
    }
  }
  herbouw();
  const teken = () => {
    bord.wis().zet(p);
    if (laatst) bord.laag('laatst', laatst);
    if (tipZet) bord.laag('merk', [tipZet.van, tipZet.naar]);
    if (S.schaak(p)) bord.laag('schaak', [S.koningVan(p, p.beurt)]);
    bord.render();
  };
  function geslagenHtml() {
    const start = { p: 8, n: 2, b: 2, r: 2, q: 1 }, nu = { w: {}, b: {} };
    p.b.forEach(x => { if (x && S.soort(x) !== 'k') { const c = S.kleur(x); nu[c][S.soort(x)] = (nu[c][S.soort(x)] || 0) + 1; } });
    const rij = c => Object.entries(start).flatMap(([so, n]) => Array(Math.max(0, n - (nu[c][so] || 0))).fill(c === 'w' ? so.toUpperCase() : so));
    const punten = c => rij(c).reduce((t, x) => t + S.WAARDE[S.soort(x)], 0);
    const mijn = L.kleur, zijn = S.anderen(L.kleur);
    return `<div><small>Jij sloeg (${punten(zijn)} punten):</small><div class="geslagen">${rij(zijn).map(x => stukSvg(x)).join('')}</div></div>
      <div><small>${esc(T.naam)} sloeg (${punten(mijn)} punten):</small><div class="geslagen">${rij(mijn).map(x => stukSvg(x)).join('')}</div></div>`;
  }
  function zetlijst() {
    let h = '';
    for (let i = 0; i < notaties.length; i += 2) h += `${i / 2 + 1}. ${notaties[i]} ${notaties[i + 1] || ''}<br>`;
    return h || 'Nog geen zetten.';
  }
  function toonPaneel(boodschap, wie = T.wie) {
    paneel.innerHTML = `<div id="b"></div>${geslagenHtml()}<div class="zetlijst" id="zl">${zetlijst()}</div>
      ${knoppen(`<button id="tip" ${L.tips >= 3 ? 'disabled' : ''}>Tip (${3 - L.tips})</button><button id="terugz" ${L.terug >= 3 || L.zetten.length < 2 ? 'disabled' : ''}>Zet terugnemen (${3 - L.terug})</button><button id="geef">Opgeven</button>`)}`;
    zegIn(paneel.querySelector('#b'), wie, boodschap, false);
    const zl = paneel.querySelector('#zl'); zl.scrollTop = zl.scrollHeight;
    paneel.querySelector('#tip').onclick = () => {
      if (!actief || L.tips >= 3) return;
      L.tips++; bewaar();
      tipZet = S.besteZet(p, 3);
      teken();
      toonPaneel(`Tip: wat denk je van het stuk op ${S.naam(tipZet.van)}? Kijk naar ${S.naam(tipZet.naar)}. Maar denk zelf ook na!`, 'robbie');
      Stem.spreek(`Kijk eens naar het stuk op ${S.naam(tipZet.van)}.`);
    };
    paneel.querySelector('#terugz').onclick = () => {
      if (!actief || L.terug >= 3 || L.zetten.length < 2) return;
      L.terug++;
      L.zetten.splice(-2, 2);
      if (L.zetten.length % 2 !== (L.kleur === 'w' ? 0 : 1)) L.zetten.pop();
      bewaar(); herbouw(); tipZet = null; teken();
      toonPaneel('Zet teruggenomen. Denk goed na!', 'robbie');
    };
    paneel.querySelector('#geef').onclick = () => venster(`<h2>Opgeven?</h2><p>Wil je deze partij echt opgeven?</p><div class="knoppen" style="justify-content:center"><button id="nee" class="knop-hoofd">Nee, verder spelen</button><button id="ja">Ja, opgeven</button></div>`, v => {
      v.querySelector('#nee').onclick = sluit;
      v.querySelector('#ja').onclick = () => { sluit(); einde('verloren', 'Je gaf op.'); };
    });
  }
  function einde(uit, reden) {
    actief = false;
    data.spel.gespeeld++;
    if (uit === 'gewonnen') data.spel.gewonnen++; else if (uit === 'remise') data.spel.remise++; else data.spel.verloren++;
    data.lopend = null; bewaar();
    const kop2 = uit === 'gewonnen' ? 'Jij wint!' : uit === 'remise' ? 'Gelijkspel!' : `${T.naam} wint`;
    const tekst = uit === 'gewonnen' ? `${reden} Wat een partij!` : uit === 'remise' ? `${reden} Niemand wint, niemand verliest.` : `${reden} Volgende keer beter! Speel de partij nog eens na in je hoofd: waar ging het mis?`;
    if (uit === 'gewonnen') { Geluid.feest(); confetti(); } else Geluid.fout();
    venster(`<h2>${kop2}</h2>${bubbel(uit === 'gewonnen' ? 'robbie' : T.wie, tekst)}
      <div class="knoppen" style="justify-content:center;margin-top:14px"><button id="bekijk">Bekijk het bord</button><button id="zaal" class="knop-hoofd">Naar de speelzaal</button></div>`, v => {
      Stem.spreek(tekst);
      v.querySelector('#bekijk').onclick = sluit;
      v.querySelector('#zaal').onclick = () => { sluit(); ga(toonSpeelzaal); };
    });
    toonPaneel(tekst);
    paneel.querySelector('.knoppen').innerHTML = '<button id="zaal2" class="knop-hoofd">Naar de speelzaal</button>';
    paneel.querySelector('#zaal2').onclick = () => ga(toonSpeelzaal);
  }
  function controleer() {
    const tt = S.toestand(p, hist);
    if (!tt) return false;
    if (tt.einde === 'mat') einde(tt.winnaar === L.kleur ? 'gewonnen' : 'verloren', 'Schaakmat!');
    else einde('remise', { pat: 'Pat!', materiaal: 'Er zijn te weinig stukken om mat te geven.', vijftig: 'Vijftig zetten zonder slag of pionzet.', herhaling: 'Drie keer dezelfde stelling.' }[tt.einde]);
    return true;
  }
  function speel(m) {
    notaties.push(S.notatie(p, m)); hist.push(S.sleutel(p));
    L.zetten.push(S.naam(m.van) + S.naam(m.naar) + (m.promo ? S.soort(m.promo) : ''));
    const van = m.van;
    p = S.doeZet(p, m); laatst = [van, m.naar]; tipZet = null;
    teken(); bord.animeer(van, m.naar);
    bewaar();
  }
  function computer() {
    actief = false;
    toonPaneel(`${T.naam} denkt na...`);
    setTimeout(() => {
      const m = S.besteZet(p, T.id);
      if (!m) return controleer();
      speel(m);
      if (controleer()) return;
      actief = true;
      toonPaneel(S.schaak(p) ? 'Schaak! Wat doe je nu?' : m.slag ? `Ik sloeg je ${NAAM[S.soort(m.slag)]}. Jouw beurt!` : 'Jouw beurt!');
      if (S.schaak(p)) Stem.spreek('Schaak!');
    }, 350);
  }
  zetInvoer(bord, () => p, {
    actief: () => actief && p.beurt === L.kleur, teken,
    melding: t => { toonPaneel(t, 'robbie'); Stem.spreek(t); },
    onZet: m => { speel(m); if (controleer()) return; computer(); },
  });
  teken();
  if (!controleer()) {
    if (p.beurt === L.kleur) { actief = true; toonPaneel(L.zetten.length ? 'Jouw beurt!' : 'Veel succes! Jij mag beginnen.'); }
    else computer();
  }
}

/* ================= Diploma ================= */
function toonDiploma() {
  const terug = () => ga(toonKaart);
  const naam = profiel && profiel.leerling ? profiel.leerling.naam : '';
  app.innerHTML = kop(terug, 'Diploma') + `<main>
    <div class="paneel geen-print" style="margin-bottom:18px;max-width:860px;margin-inline:auto">
      <label for="dn"><b>Naam op het diploma</b> (wordt niet bewaard)</label>
      <input id="dn" value="${esc(naam)}" placeholder="Typ je naam">
      ${knoppen('<button id="print" class="knop-hoofd">Print het diploma</button>')}
      <p id="pm" class="teller"></p>
    </div>
    <div class="diploma">
      <div class="duo"><svg viewBox="0 0 80 80" style="width:90px;height:90px"><use href="#aRobbie"/></svg><svg viewBox="0 0 80 80" style="width:90px;height:90px"><use href="#aBobbie"/></svg></div>
      <h1>Schaakdiploma</h1>
      <p style="font-size:20px">Robbie en Bobbie verklaren plechtig dat</p>
      <div class="wie" id="dw">${esc(naam) || '&nbsp;'}</div>
      <p style="font-size:20px">alle regels van het schaakspel kent<br>en alle 10 werelden van het Schaakkasteel heeft veroverd.</p>
      <div class="badges">${I.werelden.map(w => `<span>${esc(w.badge)}</span>`).join('')}</div>
